<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <title>通知确认</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f5f7;
      --surface: #ffffff;
      --ink: #1b232c;
      --muted: #7a8592;
      --line: #eef0f3;
      --accent: #174c79;
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column;
      color: var(--ink); background: var(--bg);
      font: 16px/1.75 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, a { font: inherit; }
    button { cursor: pointer; }
    a { color: var(--accent); }
    :focus-visible { outline: 2px solid #377fb5; outline-offset: 3px; }
    main { width: 100%; max-width: 480px; margin-inline: auto; padding: 14px 14px 8px; }
    .notice-card {
      margin: 0 0 14px; padding: 26px 22px 24px;
      background: var(--surface); border-radius: var(--radius);
      box-shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 12px 32px -18px rgba(16, 24, 40, .22);
    }
    h1, h2, p { margin: 0; overflow-wrap: anywhere; }
    .source {
      display: flex; align-items: center; gap: 7px;
      font-size: 12px; letter-spacing: .06em; color: var(--muted);
    }
    .source .tag { color: var(--accent); font-weight: 600; }
    h1 {
      margin-top: 8px;
      font-size: clamp(21px, 5vw, 25px); line-height: 1.42;
      letter-spacing: -.01em; font-weight: 700;
    }
    .rule { height: 1px; margin: 18px 0 20px; background: var(--line); }
    #body { white-space: pre-wrap; line-height: 1.9; color: #2b3540; }
    /* 2026-11-21 需求四：二级页面统一左上角返回图标（线性左箭头，触控热区 44×44） */
    .page-back {
      display: inline-flex; align-items: center; justify-content: center;
      width: 44px; height: 44px; margin: 0 0 2px -8px; padding: 0;
      border: 0; border-radius: 12px; background: none; color: var(--accent);
      cursor: pointer;
    }
    .page-back:active { background: rgba(29, 78, 137, .08); }
    .page-back[hidden] { display: none; }
    .page-back svg { width: 22px; height: 22px; }
    /* 图片：满幅嵌入正文下方，无灰底框、无文字标题 */
    .figure {
      display: block; width: 100%; margin: 18px 0 0; padding: 0;
      border: 0; background: none; border-radius: 12px; overflow: hidden;
    }
    .figure img { display: block; width: 100%; height: auto; border-radius: 12px; }
    /* 视频与文件附件：视频在线播放（不提供下载）；文件仅保留「下载」入口 */
    .attachments { margin-top: 18px; padding-top: 4px; border-top: 1px solid var(--line); }
    .video-block { padding: 14px 0 2px; }
    .video-block + .video-block { border-top: 1px solid var(--line); }
    video { display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; background: #17202a; }
    .media-row {
      display: flex; align-items: center; justify-content: flex-end; gap: 12px;
      min-height: 48px; padding: 4px 0;
    }
    .media-row + .media-row, .video-block + .media-row { border-top: 1px solid var(--line); }
    .download {
      flex: none; display: inline-flex; align-items: center;
      min-height: 40px; padding: 0 16px; border-radius: 10px;
      background: #f4f7fa; color: var(--accent); font-size: 13px; font-weight: 600;
      text-decoration: none; white-space: nowrap;
    }
    #actions {
      position: sticky; bottom: 0; z-index: 1; margin-top: auto;
      padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
      background: rgba(255, 255, 255, .94);
      box-shadow: 0 -10px 28px -20px rgba(16, 24, 40, .45);
      border-top: 1px solid var(--line);
      backdrop-filter: blur(8px);
    }
    .action-inner { width: 100%; max-width: 452px; margin-inline: auto; }
    #hint { margin-bottom: 8px; text-align: center; color: var(--muted); font-size: 13px; }
    #hint:empty { display: none; }
    #confirm {
      width: 100%; min-height: 48px; padding: 12px 16px;
      border: 0; border-radius: 14px; background: var(--accent); color: #fff;
      font-size: 16px; font-weight: 650; overflow-wrap: anywhere;
    }
    #confirm:disabled { cursor: default; background: #eceff3; color: #8a95a1; }
    #confirm[data-confirmed] { background: #e9f4ec; color: #26603c; }
    /* 2026-11-20：看图预览不设任何悬浮按钮 —— 整图铺满无遮挡，
       退出靠「单击图片/遮罩」「Esc」「手机返回键」三种系统原生手势。 */
    #zoom {
      position: fixed; inset: 0; z-index: 40;
      display: flex; align-items: center; justify-content: center;
      background: #000; color: #fff; overscroll-behavior: contain;
    }
    #zoom img {
      max-width: 100vw; max-height: 100vh;
      width: auto; height: auto; object-fit: contain;
      transform-origin: 0 0; touch-action: none; user-select: none; -webkit-user-select: none;
      -webkit-touch-callout: default; /* 长按仍触发系统保存/识别菜单 */
    }
    #zoom img.dragging { cursor: grabbing; }
  </style>
</head>
<body>
  <main>
    <button type="button" id="page-back" class="page-back" aria-label="返回上一级" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="notice-card" id="loading" role="status">正在读取通知…</div>
    <article id="notice" hidden>
      <section class="notice-card">
        <header>
          <p class="source"><span class="tag">德阳量密助手</span><span aria-hidden="true">/</span><span>通知公告</span></p>
          <h1 id="title"></h1>
        </header>
        <div class="rule" aria-hidden="true"></div>
        <div id="body-card" hidden><p id="body"></p></div>
        <div id="media"></div>
      </section>
    </article>
    <div id="end" aria-hidden="true"></div>
  </main>
  <footer id="actions" hidden>
    <div class="action-inner">
      <p id="hint" role="status"></p>
      <button type="button" id="confirm" disabled></button>
    </div>
  </footer>
  <div id="zoom" role="dialog" aria-modal="true" aria-label="图片预览" hidden>
    <img alt="">
  </div>
  <script>
    'use strict';
    const $ = id => document.getElementById(id);
    /* ── 原生看图手势（2026-11-20 需求 C，纯原生 JS，零外部依赖）──
       单击(未放大时)/点遮罩/Esc/系统返回 → 关闭；双击 → 1x⇄2x；
       双指捏合 1x~4x；放大后单指拖拽；PC：滚轮缩放 + 左键拖拽。 */
    const zoomState = { scale: 1, tx: 0, ty: 0, lastTap: 0, tapStart: null, pinch: null, drag: null };
    function applyZoom(img) {
      img.style.transform = zoomState.scale === 1 && !zoomState.tx && !zoomState.ty
        ? '' : `translate(${zoomState.tx}px, ${zoomState.ty}px) scale(${zoomState.scale})`;
    }
    function clampTranslate() {
      if (zoomState.scale <= 1) { zoomState.tx = 0; zoomState.ty = 0; return; }
      const img = zoom.querySelector('img');
      const maxX = Math.max(0, (img.clientWidth * zoomState.scale - innerWidth) / 2);
      const maxY = Math.max(0, (img.clientHeight * zoomState.scale - innerHeight) / 2);
      zoomState.tx = Math.min(maxX, Math.max(-maxX, zoomState.tx));
      zoomState.ty = Math.min(maxY, Math.max(-maxY, zoomState.ty));
    }
    /* 2026-11-23：查询参数与 hash 双兼容（`?from=portal#t=…` 与 `#t=…` 都能读到）。 */
    const params = new URLSearchParams(location.search);
    new URLSearchParams(location.hash.slice(1)).forEach((value, key) => params.set(key, value));
    const token = params.get('t') || '';
    /* 前缀只取 '/h5/' 之前的部分，异常路径退化为空串（原 split('/')[0] 会拼出错误地址）。 */
    const api = (location.pathname.includes('/h5/')
      ? location.pathname.slice(0, location.pathname.indexOf('/h5/')) : '') + '/api/h5/notice-receipt';
    const confirmButton = $('confirm');
    const zoom = $('zoom');
    let data, reachedEnd = false, previousFocus, confirming = false;
    window.addEventListener('hashchange', () => location.reload());

    function node(tag, text, className) {
      const element = document.createElement(tag);
      if (text) element.textContent = text;
      if (className) element.className = className;
      return element;
    }

    async function request(action) {
      const response = await fetch(api + '/' + action, {
        method: 'POST', cache: 'no-store', headers: { 'Authorization': 'Bearer ' + token },
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.message || '通知暂不可用');
      return result;
    }

    function mediaUrl(id, download = false) {
      return api + '/media?token=' + encodeURIComponent(token) + '&id=' + id + (download ? '&download=1' : '');
    }

    /* 2026-11-20：视频在线播放即可，**不再提供下载**；文件不支持在线预览，
       只保留一个「下载」入口——两者都不再显示文件名与体积描述。 */
    function downloadLink(item) {
      const row = node('div', '', 'media-row');
      const link = node('a', '下载', 'download');
      link.href = mediaUrl(item.id, true);
      link.download = item.name;
      row.append(link);
      return row;
    }

    function renderMedia(items) {
      const images = items.filter(item => item.kind === 'image');
      const videos = items.filter(item => item.kind === 'video');
      const files = items.filter(item => item.kind === 'file');
      for (const item of images) {
        const button = node('button', '', 'figure');
        button.type = 'button';
        button.setAttribute('aria-label', '放大预览 ' + item.name);
        const image = node('img');
        image.src = mediaUrl(item.id);
        image.alt = item.name;
        image.loading = 'lazy';
        button.append(image);
        button.onclick = () => {
          previousFocus = button;
          const target = zoom.querySelector('img');
          target.src = image.src;
          target.alt = item.name;
          Object.assign(zoomState, { scale: 1, tx: 0, ty: 0, lastTap: 0, tapStart: null, pinch: null, drag: null });
          applyZoom(target);
          zoom.hidden = false;
          ensurePopstate();
        };
        $('media').append(button);
      }
      if (!videos.length && !files.length) return;
      const section = node('section', '', 'attachments');
      for (const item of videos) {
        const entry = node('div', '', 'video-block');
        const video = node('video');
        video.controls = true;
        video.playsInline = true;
        video.preload = 'metadata';
        video.src = mediaUrl(item.id);
        video.setAttribute('aria-label', item.name);
        entry.append(video);
        section.append(entry);
      }
      for (const item of files) section.append(downloadLink(item));
      $('media').append(section);
    }

    function closeZoom(fromPop) {
      zoom.hidden = true;
      Object.assign(zoomState, { scale: 1, tx: 0, ty: 0, lastTap: 0, tapStart: null, pinch: null, drag: null });
      applyZoom(zoom.querySelector('img'));
      if (!fromPop) { try { history.back(); } catch (e) { /* webview 拒绝时退化 */ } }
      previousFocus?.focus();
    }
    /* 单击（未放大时）→ 关闭；遮罩 → 关闭；双击 → 1x⇄2x；滚轮 → 缩放；
       双指捏合 1x~4x；放大后单指/鼠标拖拽。popstate 让系统返回键先关预览。 */
    let popstateHandler = null;
    function ensurePopstate() {
      try { history.pushState({ imtZoom: true }, '', location.href); } catch (e) { /* 某些内嵌 webview 拒绝 pushState，静默退化 */ }
      if (!popstateHandler) {
        popstateHandler = () => { if (!zoom.hidden) closeZoom(true); };
        window.addEventListener('popstate', popstateHandler);
      }
    }
    function zoomToggle() {
      zoomState.scale = zoomState.scale > 1 ? 1 : 2;
      clampTranslate();
      applyZoom(zoom.querySelector('img'));
    }
    zoom.addEventListener('click', event => {
      if (event.target === zoom) { closeZoom(false); return; }
      if (event.target.tagName !== 'IMG') return;
      if (zoomState.scale <= 1) { closeZoom(false); return; }
      const now = Date.now();
      if (now - (zoomState.lastTap || 0) < 300) { zoomToggle(); zoomState.lastTap = 0; return; }
      zoomState.lastTap = now;
      Object.assign(zoomState, { scale: 1, tx: 0, ty: 0 });
      clampTranslate(); applyZoom(zoom.querySelector('img'));
    });
    zoom.addEventListener('wheel', event => {
      if (zoom.hidden) return;
      event.preventDefault();
      zoomState.scale = Math.min(4, Math.max(1, zoomState.scale * (event.deltaY < 0 ? 1.2 : 1 / 1.2)));
      clampTranslate(); applyZoom(zoom.querySelector('img'));
    }, { passive: false });
    zoom.addEventListener('touchstart', event => {
      if (event.touches.length === 2) {
        const [a, b] = event.touches;
        zoomState.pinch = { d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), scale: zoomState.scale };
        zoomState.drag = null;
      } else if (event.touches.length === 1) {
        const t = event.touches[0];
        if (zoomState.scale > 1) zoomState.drag = { x: t.clientX, y: t.clientY, tx: zoomState.tx, ty: zoomState.ty };
        else { zoomState.drag = null; zoomState.tapStart = { x: t.clientX, y: t.clientY, time: Date.now() }; }
      }
    }, { passive: true });
    zoom.addEventListener('touchmove', event => {
      if (zoomState.pinch && event.touches.length === 2) {
        event.preventDefault();
        const [a, b] = event.touches;
        const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
        zoomState.scale = Math.min(4, Math.max(1, zoomState.pinch.scale * (d / zoomState.pinch.d)));
        clampTranslate(); applyZoom(zoom.querySelector('img'));
      } else if (zoomState.drag && event.touches.length === 1) {
        event.preventDefault();
        const t = event.touches[0];
        zoomState.tx = zoomState.drag.tx + (t.clientX - zoomState.drag.x);
        zoomState.ty = zoomState.drag.ty + (t.clientY - zoomState.drag.y);
        clampTranslate(); applyZoom(zoom.querySelector('img'));
      }
    }, { passive: false });
    zoom.addEventListener('touchend', event => {
      if (zoomState.pinch && event.touches.length < 2) zoomState.pinch = null;
      if (zoomState.drag && event.touches.length === 0) zoomState.drag = null;
      const start = zoomState.tapStart;
      if (start && event.changedTouches.length === 1) {
        const t = event.changedTouches[0];
        const moved = Math.hypot(t.clientX - start.x, t.clientY - start.y);
        if (moved < 10 && Date.now() - start.time < 300) {
          const now = Date.now();
          if (now - (zoomState.lastTap || 0) < 300) { zoomToggle(); zoomState.lastTap = 0; }
          else zoomState.lastTap = now;
        }
        zoomState.tapStart = null;
      }
    });
    document.addEventListener('keydown', event => {
      if (zoom.hidden) return;
      if (event.key === 'Escape') closeZoom(false);
    });
    /* 2026-11-21 需求四：仅从工作台跳入时显示左上角返回图标（聊天窗直接打开的根页面不显示） */
    $('page-back').hidden = params.get('from') !== 'portal';
    $('page-back').onclick = () => history.back();

    function updateButton() {
      if (!data) return;
      if (data.confirmed_at) {
        confirmButton.disabled = true;
        confirmButton.dataset.confirmed = '';
        confirmButton.textContent = '已确认 · ' + data.confirmed_at;
        return;
      }
      confirmButton.textContent = confirming ? '正在确认…' : data.button_label;
      reachedEnd ||= $('end').getBoundingClientRect().bottom <= $('actions').getBoundingClientRect().top + 2;
      confirmButton.disabled = !data.confirmation_open || !reachedEnd || confirming;
      $('hint').textContent = !data.confirmation_open ? '通知已停用，暂时无法确认' :
        !reachedEnd ? '请滑动阅读到底部后确认' : '';
    }

    confirmButton.onclick = async () => {
      if (confirmButton.disabled) return;
      confirming = true;
      updateButton();
      try {
        const result = await request('confirm');
        data.confirmed_at = result.receipt_at;
        $('hint').textContent = '确认成功';
        updateButton();
      } catch (error) {
        confirming = false;
        updateButton();
        $('hint').textContent = error.message;
      }
    };

    async function render() {
      try {
        data = await request('info');
        document.title = data.title + ' · 通知确认';
        $('title').textContent = data.title;
        $('body').textContent = data.body;
        $('body-card').hidden = !data.body;
        renderMedia(data.media);
        $('loading').hidden = true;
        $('notice').hidden = false;
        $('actions').hidden = false;
        updateButton();
        window.addEventListener('scroll', updateButton, { passive: true });
        window.addEventListener('resize', updateButton);
      } catch (error) {
        $('loading').textContent = error.message;
      }
    }
    render();
  </script>
</body>
</html>
