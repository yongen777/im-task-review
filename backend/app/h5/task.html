<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="referrer" content="no-referrer" />
  <title>任务提交 - IMTask</title>
  <style>
    :root {
      --blue: #15558a;
      --ink: #182530;
      --secondary: #485761;
      --muted: #596876;
      --paper: #fff;
      --canvas: #f3f5f7;
      --line: #d5dde4;
      --selection: #edf4fa;
      --panel: 12px;
      --control: 8px;
      font: 400 16px/1.55 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
      background: var(--canvas);
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    h1, h2, h3, strong { font-weight: 600; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { opacity: .55; cursor: default; }
    :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .btn, .primary, .secondary {
      min-height: 44px; padding: 8px 16px; border: 1px solid transparent;
      border-radius: var(--control); background: var(--blue); color: white; font-weight: 500;
    }
    .secondary { background: var(--paper); border-color: var(--line); color: var(--blue); }
    .btn:active, .primary:active { background: #10436e; }
    .secondary:active { background: var(--selection); }
    .icon { width: 18px; height: 18px; flex: none; vertical-align: middle; }
    .field label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 500; }
    .field input:not([type=file]), .field select, .field textarea {
      width: 100%; min-height: 44px; padding: 8px 12px; border: 1px solid var(--line);
      border-radius: var(--control); background: var(--paper);
    }
    .field textarea { resize: vertical; }
    .msg { display: none; margin-top: 12px; padding: 12px; border: 1px solid var(--line); border-radius: var(--control); font-size: 14px; }
    .msg.error { display: block; background: #fff3f1; color: #972e27; }
    .msg.success { display: block; background: #edf7f2; color: #1b644e; }
    .msg.neutral { display: block; color: var(--secondary); }
    .feedback { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: max-content; max-width: calc(100% - 32px); padding: 12px 16px; border-radius: var(--control); background: #182530; color: #fff; z-index: 10; font-size: 14px; }
    .feedback.success { background: #1b644e; }
    .task-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    body { padding: 16px 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
    .card { max-width: 640px; margin: auto; }
    .block, .task-head { background: var(--paper); border: 1px solid var(--line); border-radius: var(--panel); padding: 16px; margin-bottom: 12px; }
    .task-head { border-left: 4px solid var(--blue); }
    .row1 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; margin-bottom: 12px; }
    .title { font-size: 22px; margin: 0; overflow-wrap: anywhere; }
    .deadline { font-size: 14px; color: var(--blue); }
    .desc { white-space: pre-line; overflow-wrap: anywhere; }
    .meta { color: var(--secondary); font-size: 14px; margin-top: 12px; }
    .block-head { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; font-weight: 500; }
    .hint { margin-left: auto; color: var(--muted); font-size: 13px; }
    .field-row { margin-bottom: 12px; }
    .field-row:last-child { margin-bottom: 0; }
    .field label.upload-file, .field label.upload-tile {
      position: relative; display: flex; align-items: center; justify-content: center;
      gap: 8px; min-height: 48px; padding: 8px 12px; margin: 0;
      background: var(--selection); color: var(--blue); border: 1px dashed #8199ad;
      border-radius: var(--control); cursor: pointer;
    }
    .upload-file input, .upload-tile input { position: absolute; inset: 0; width: 100%; opacity: 0; cursor: pointer; }
    .upload-file:focus-within, .upload-tile:focus-within { outline: 2px solid var(--blue); }
    .upload-tile:has(input:disabled), .upload-file:has(input:disabled) { opacity: .55; }
    .upload-status { display: block; color: var(--muted); font-size: 14px; }
    .upload-status:not(:empty), .ref-list:not(:empty) { margin-top: 12px; }
    .ref-list { display: grid; gap: 8px; }
    .attachment-row { display: flex; align-items: center; gap: 12px; padding: 8px; border: 1px solid var(--line); border-radius: var(--control); }
    .attachment-row .filename { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 14px; }
    .thumb { display: block; width: 56px; height: 56px; object-fit: cover; border-radius: 4px; }
    .thumb-button { padding: 0; border: 0; background: none; flex: none; }
    .attachment-row .secondary { padding: 8px 12px; font-size: 14px; }
    .saved-content { margin-top: 12px; }
    .saved-content h2 { margin: 0 0 12px; font-size: 18px; }
    .saved-content dl, .saved-content dd { margin: 0; }
    .saved-content dt { color: var(--secondary); font-size: 14px; margin-top: 12px; }
    .saved-content dd { white-space: pre-wrap; overflow-wrap: anywhere; }
    .locked-tip { padding: 12px; margin: 12px 0; border: 1px solid var(--line); border-radius: var(--control); background: var(--selection); }
    .locked-tip.warning { background: #fff7eb; color: #79460d; }
    .btn { width: 100%; position: sticky; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
    .preview { width: min(640px, calc(100% - 32px)); max-height: 88vh; padding: 16px; border: 1px solid var(--line); border-radius: var(--panel); }
    .preview::backdrop { background: #182530b3; }
    .preview img { display: block; width: 100%; max-height: 68vh; object-fit: contain; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <div id="loading">正在加载任务信息...</div>
    <div id="content" style="display:none;">
      <div class="task-head">
        <div class="row1">
          <h1 class="title" id="headTitle"></h1>
          <span class="deadline" id="headDeadline"></span>
        </div>
        <div class="desc" id="headDesc"></div>
        <div class="meta">提交人：<span id="memberName"></span><span id="taskTime" hidden></span> · 状态：<span class="badge" id="instStatus"></span></div>
      </div>
      <div id="dynamicArea"></div>
      <div class="block" id="noteField" style="display:none;">
        <div class="block-head"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span class="name">备注说明（选填）</span></div>
        <div class="field"><textarea id="noteInput" rows="3" placeholder="请输入补充说明"></textarea></div>
      </div>
      <div class="task-actions" id="taskActions"><button class="btn" id="submitBtn" type="button">提交任务</button></div>
    </div>
    <div id="msgBox" class="msg" role="status"></div>
  </div>
  <div id="feedback" class="feedback" role="status" hidden></div>
  <dialog class="preview" id="preview" aria-label="图片预览">
    <form method="dialog"><button class="secondary">关闭预览</button></form>
    <img alt="">
  </dialog>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.hash.replace(/^#/, ""));
      const token = params.get("t") || "";
      const wantsEdit = params.get("edit") === "1";
      const result = params.get("result");
      const feedback = document.getElementById("feedback");
      let feedbackTimer, editing = false;
      if (result) {
        params.delete("result");
        history.replaceState(null, "", "#" + params.toString());
      }
      function switchView(edit, notice) {
        if (edit) params.set("edit", "1"); else params.delete("edit");
        if (notice) params.set("result", notice);
        history.replaceState(null, "", "#" + params.toString());
        location.reload();
      }
      async function taskRequest(route, options, timeout = 20000) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeout);
        try {
          const response = await fetch(route, { ...options, signal: controller.signal, cache: "no-store" });
          const data = response.ok && route.endsWith("/attachment") ? await response.blob() : await response.json();
          return { ok: response.ok, data };
        } catch (error) {
          throw Error(controller.signal.aborted ? "操作超时，请重试" : "网络请求失败，请重试");
        } finally { clearTimeout(timer); }
      }
      function showTaskTime(instance, publishedAt) {
        const time = document.getElementById("taskTime");
        time.hidden = !instance.submitted_at && !publishedAt;
        time.textContent = instance.submitted_at ? " · 完成时间：" + instance.submitted_at
          : publishedAt ? " · 执行时间：" + publishedAt : "";
      }
      const loadingEl = document.getElementById("loading");
      const contentEl = document.getElementById("content");
      const msgBox = document.getElementById("msgBox");
      const submitBtn = document.getElementById("submitBtn");
      const taskActions = document.getElementById("taskActions");
      let taskInfo = null;
      let uploadedRefs = [];
      let activeUploads = 0;
      /* 2026-10-30：管理员勾了哪些模块，用户就必须完成哪些。
         模块清单与各模块已上传的 ref 需要给「提交」按钮那层用，所以在外面留一份。 */
      let h5Modules = [];
      let refsByModule = {};
      let h5Schema = [];

      function showMsg(text, type) {
        msgBox.textContent = text;
        msgBox.className = "msg " + type;
        feedback.textContent = text;
        feedback.className = "feedback " + type;
        feedback.hidden = false;
        clearTimeout(feedbackTimer);
        feedbackTimer = setTimeout(() => { feedback.hidden = true; }, 3800);
      }

      async function openSavedAttachment(attachment, button) {
        button.disabled = true;
        try {
          const response = await taskRequest("/api/h5/task/attachment", {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-H5-Token": token },
            body: JSON.stringify({ ref: attachment.ref })
          });
          if (!response.ok) {
            showMsg(response.data.message || "附件读取失败", "error");
            return;
          }
          const blob = response.data;
          const url = URL.createObjectURL(blob);
          const dialog = document.getElementById("preview");
          if (attachment.mime.startsWith("image/") && typeof dialog.showModal === "function") {
            const image = dialog.querySelector("img");
            image.src = url;
            image.alt = attachment.file_name;
            dialog.addEventListener("close", () => {
              image.removeAttribute("src");
              URL.revokeObjectURL(url);
            }, { once: true });
            dialog.showModal();
          } else {
            const link = document.createElement("a");
            link.href = url;
            link.download = attachment.file_name;
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 30000);
          }
        } catch (error) {
          showMsg(error.message, "error");
        } finally {
          button.disabled = false;
        }
      }

      function renderSavedSubmission(submission, template, container) {
        if (!submission) return;
        const section = document.createElement("section");
        section.className = "block saved-content";
        const title = document.createElement("h2");
        title.textContent = "已提交内容";
        section.appendChild(title);
        const detail = document.createElement("dl");
        function appendValue(label, value) {
          const term = document.createElement("dt");
          term.textContent = label;
          const description = document.createElement("dd");
          description.textContent = value;
          detail.append(term, description);
        }
        appendValue(submission.source === "admin" ? "管理员代交时间" : "提交时间", submission.submitted_at);
        const fields = new Map((template.schema_json || []).map(field => [field.key, field.label]));
        for (const [key, value] of Object.entries(submission.fields)) {
          appendValue(fields.get(key) || key, value === true ? "是" : value === false ? "否" : String(value ?? ""));
        }
        if (submission.note) appendValue(template.text_label || "文字说明", submission.note);
        section.appendChild(detail);
        for (const attachment of submission.attachments) {
          const row = document.createElement("div");
          row.className = "attachment-row saved-content";
          const name = document.createElement("span");
          name.className = "filename";
          name.textContent = attachment.file_name;
          const button = document.createElement("button");
          button.type = "button";
          button.className = "secondary";
          button.textContent = attachment.mime.startsWith("image/") ? "预览图片" : "下载附件";
          button.setAttribute("aria-label", button.textContent + " " + attachment.file_name);
          button.onclick = () => openSavedAttachment(attachment, button);
          row.append(name, button);
          section.appendChild(row);
        }
        container.appendChild(section);
      }

      if (!token) {
        loadingEl.style.display = "none";
        showMsg("链接缺少任务令牌 (#t=...)", "error");
        return;
      }

      taskRequest("/api/h5/task/info", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: token })
      })
        .then(({ ok, data }) => {
          loadingEl.style.display = "none";
          if (!ok) return showMsg(data.message || "任务加载失败", "error");
          taskInfo = data;
          editing = wantsEdit && data.can_edit;
          if (params.get("from") === "portal" && !editing) {
            const back = document.createElement("button");
            back.type = "button";
            back.className = "secondary";
            back.textContent = "返回工作台";
            back.onclick = () => history.back();
            taskActions.appendChild(back);
          }
          contentEl.style.display = "block";
          document.getElementById("memberName").textContent = data.instance.name_snap;
          showTaskTime(data.instance, data.published_at);
          /* 2026-11-12 任务E5：cancelled（成员移出分组后作废）补「已取消」徽章；
             无截止模板的截止时间展示「不限」。 */
          const STATUS_TEXT = { pending: "待上传", submitted: "待审核", approved: "已完成", rejected: "已驳回", overdue: "已逾期", expired: "已过期", cancelled: "已取消" };
          document.getElementById("instStatus").textContent = STATUS_TEXT[data.instance.status] || data.instance.status;

          /* 顶部任务卡：标题 + 截止徽章 + 提醒正文（与预览版式一致） */
          document.getElementById("headTitle").textContent = data.template.name;
          /* 2026-11-13 用户拍板：截止徽章统一显示**具体日期**（如「11月30日 17:00」/「不限」），
             优先用实例自身的 deadline_display（旧周期链接不随当前月份漂移）；
             deadline_rule 仅作兜底（模板未建实例时的旧字段）。 */
          const __rule = String(data.template.deadline_display || data.template.deadline_rule || "").trim();
          document.getElementById("headDeadline").textContent = "截止 " + (__rule || "不限");
          document.getElementById("headDeadline").hidden = data.template.is_adhoc;
          document.getElementById("headDesc").textContent = String(data.template.text_tpl || "").replace(/\\n/g, "\n");

          if (!editing && (data.readonly_history || ["submitted", "approved"].includes(data.instance.status))) {
            const tip = document.createElement("div");
            tip.className = "locked-tip";
            tip.setAttribute("role", "status");
            tip.textContent = data.window_reason || (data.instance.status === "submitted"
              ? "本任务已提交，正在等待管理员审核"
              : "本任务已提交完成，无需重复提交");
            const area = document.getElementById("dynamicArea");
            contentEl.insertBefore(tip, area);
            renderSavedSubmission(data.submission, data.template, area);
            submitBtn.disabled = true;
            submitBtn.hidden = true;
            if (data.can_edit) {
              const editButton = document.createElement("button");
              editButton.type = "button";
              editButton.className = "btn";
              editButton.textContent = "编辑提交内容";
              editButton.onclick = () => switchView(true);
              taskActions.appendChild(editButton);
            }
            if (result === "saved") showMsg("修改已保存", "success");
            else if (result === "cancelled") showMsg("已取消修改，原提交已保留", "neutral");
            else if (result === "done") showMsg(data.instance.status === "submitted" ? "提交成功，等待审核" : "提交成功，任务已完成", "success");
            else if (wantsEdit) showMsg("这条提交已关闭编辑", "error");
            return;
          }
          if (editing) {
            submitBtn.textContent = "保存修改";
            const cancel = document.createElement("button");
            cancel.type = "button";
            cancel.className = "secondary";
            cancel.textContent = "取消修改";
            cancel.onclick = () => { if (!submitBtn.disabled) switchView(false, "cancelled"); };
            taskActions.appendChild(cancel);
          }

          const area = document.getElementById("dynamicArea");
          const spec = data.template.spec_json || {};
          h5Modules = Array.isArray(data.template.upload_modules) ? data.template.upload_modules : [];
          const modules = h5Modules.length ? h5Modules : {
            form: ["fields"], image: ["image"], file: ["file"],
          }[data.template.kind] || [];
          const attachmentLimits = data.template.attachment_limits || {};
          h5Schema = Array.isArray(data.template.schema_json) ? data.template.schema_json : [];
          let textModuleOn = false;

          /* 统一的模块卡片：图标 + 标题 + 右侧提示 + 内容区 */
          function makeBlock(title, hint) {
            const block = document.createElement("div");
            block.className = "block";
            const head = document.createElement("div");
            head.className = "block-head";
            const name = document.createElement("span");
            name.className = "name";
            name.textContent = title;
            head.appendChild(name);
            if (hint) {
              const h = document.createElement("span");
              h.className = "hint";
              h.textContent = hint;
              head.appendChild(h);
            }
            block.appendChild(head);
            area.appendChild(block);
            const body = document.createElement("div");
            body.className = "field";
            block.appendChild(body);
            return body;
          }

          /* 图片 / 文件模块：可多选，逐个上传换取 ref。
             ⚠️ 每个模块各自维护自己的 ref 列表（moduleRefs），最后合并成 uploadedRefs ——
             以前共用一个数组、每次 change 都清空，导致「先选图片再选文件」会把图片丢掉。 */
          const moduleRefs = {};
          function syncRefs() {
            uploadedRefs = [];
            Object.keys(moduleRefs).forEach((k) => { uploadedRefs = uploadedRefs.concat(moduleRefs[k]); });
            refsByModule = moduleRefs;
          }
          function makeUploadBlock(title, hint, accept, previewImages, moduleKey) {
            const body = makeBlock(title, hint);
            // 图片和文档使用同一选择控件，上传结果在下方排列。
            const grid = document.createElement("div");
            grid.className = previewImages ? "upload-grid" : "";
            body.appendChild(grid);

            const label = document.createElement("label");
            if (previewImages) {
              label.className = "upload-tile";
              label.innerHTML = '<svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg><span>选择图片</span>';
            } else {
              label.className = "upload-file";
              label.textContent = "选择文档";
            }
            const fileInp = document.createElement("input");
            fileInp.type = "file";
            const limit = attachmentLimits[moduleKey] || 1;
            const unit = previewImages ? "张图片" : "个文件";
            fileInp.multiple = limit > 1;
            if (accept) fileInp.accept = accept;
            label.appendChild(fileInp);
            grid.appendChild(label);

            const uploadStatus = document.createElement("span");
            uploadStatus.className = "upload-status";
            uploadStatus.setAttribute("role", "status");
            body.appendChild(uploadStatus);

            const refList = document.createElement("div");
            refList.className = "ref-list";
            body.appendChild(refList);
            let uploaded = editing ? (data.submission.attachments || [])
              .filter(item => item.mime.startsWith("image/") === previewImages)
              .map(item => ({ ref: item.ref, name: item.file_name, saved: item })) : [];
            function renderUploads() {
              moduleRefs[moduleKey] = uploaded.map(item => item.ref);
              syncRefs();
              refList.replaceChildren();
              for (const item of uploaded) {
                const line = document.createElement("div");
                line.className = "attachment-row";
                const filename = document.createElement("span");
                filename.className = "filename";
                filename.textContent = item.name;
                line.appendChild(filename);
                const remove = document.createElement("button");
                remove.type = "button";
                remove.className = "secondary";
                remove.textContent = "移除";
                remove.setAttribute("aria-label", "移除 " + item.name);
                remove.addEventListener("click", () => {
                  if (activeUploads || submitBtn.disabled) return;
                  uploaded = uploaded.filter(entry => entry !== item);
                  if (item.preview) URL.revokeObjectURL(item.preview);
                  renderUploads();
                });
                line.appendChild(remove);
                refList.appendChild(line);
                if (item.saved) {
                  const open = document.createElement("button");
                  open.type = "button";
                  open.className = "secondary";
                  open.textContent = previewImages ? "预览" : "下载";
                  open.setAttribute("aria-label", open.textContent + " " + item.name);
                  open.onclick = () => openSavedAttachment(item.saved, open);
                  line.prepend(open);
                } else if (item.preview) {
                  const img = document.createElement("img");
                  img.className = "thumb";
                  img.src = item.preview;
                  img.alt = item.name;
                  const previewButton = document.createElement("button");
                  previewButton.type = "button";
                  previewButton.className = "thumb-button";
                  previewButton.setAttribute("aria-label", "预览 " + item.name);
                  previewButton.appendChild(img);
                  previewButton.addEventListener("click", () => {
                    const dialog = document.getElementById("preview");
                    if (typeof dialog.showModal !== "function") {
                      window.open(item.preview, "_blank", "noopener");
                      return;
                    }
                    const large = dialog.querySelector("img");
                    large.src = item.preview;
                    large.alt = item.name;
                    dialog.showModal();
                  });
                  line.prepend(previewButton);
                }
              }
            }
            renderUploads();
            fileInp.addEventListener("change", async () => {
              const chosen = Array.from(fileInp.files);
              fileInp.value = "";
              if (!chosen.length) return;
              if (chosen.length + (limit > 1 ? uploaded.length : 0) > limit) {
                showMsg("最多上传 " + limit + " " + unit, "error");
                return;
              }
              fileInp.disabled = true;
              activeUploads++;
              uploadStatus.textContent = "正在上传…";
              try {
                for (const f of chosen) {
                  const fname = (f.name || "").toLowerCase();
                  const ftype = (f.type || "").toLowerCase();
                  if (fname.endsWith(".heic") || fname.endsWith(".heif") || /hei[cf]/.test(ftype)) {
                    showMsg("暂不支持 HEIC 原图格式，请截图或转为 JPG/PNG 后上传", "error");
                    continue;
                  }
                  const fd = new FormData();
                  fd.append("file", f);
                  const r = await taskRequest(editing ? "/api/h5/task/edit-upload" : "/api/h5/task/upload", {
                    method: "POST", headers: { "X-H5-Token": token }, body: fd
                  }, 90000);
                  const res = r.data;
                  if (!r.ok) {
                    showMsg(
                      previewImages && res.code === "FILE_TYPE_REJECTED"
                        ? "图片校验未通过：请改用 JPG/PNG/WEBP/BMP/GIF 格式（HEIC 原图可截图后上传）"
                        : (res.message || "上传失败"),
                      "error",
                    );
                    break;
                  }
                  if (Boolean(String(res.mime || "").startsWith("image/")) !== previewImages) {
                    showMsg(previewImages ? "请选择图片格式" : "请选择文档文件", "error");
                    break;
                  }
                  if (limit === 1) {
                    uploaded.forEach(item => { if (item.preview) URL.revokeObjectURL(item.preview); });
                    uploaded = [];
                  }
                  uploaded.push({
                    ref: res.ref, name: res.file_name || f.name,
                    preview: previewImages ? URL.createObjectURL(f) : "",
                  });
                  renderUploads();
                }
              } catch (e) {
                showMsg(e.message, "error");
              } finally {
                activeUploads--;
                uploadStatus.textContent = "";
                fileInp.disabled = false;
              }
            });
            return fileInp;
          }

          {
            /* 字段模块 */
            if (modules.includes("fields")) {
              const fields = Array.isArray(data.template.schema_json) ? data.template.schema_json : [];
              const body = makeBlock("数据报数填报", "");
              fields.forEach(f => {
                const wrap = document.createElement("div");
                wrap.classList.add("field-row");
                const lbl = document.createElement("label");
                lbl.textContent = f.label + (f.required ? " *" : "");
                wrap.appendChild(lbl);
                let inp;
                if (f.type === "boolean" || (f.type === "select" && Array.isArray(f.options))) {
                  inp = document.createElement("select");
                  const empty = document.createElement("option");
                  empty.value = "";
                  empty.textContent = "请选择";
                  inp.appendChild(empty);
                  (f.type === "boolean" ? ["是", "否"] : f.options).forEach(opt => {
                    const o = document.createElement("option");
                    o.value = opt;
                    o.textContent = opt;
                    inp.appendChild(o);
                  });
                } else {
                  inp = document.createElement("input");
                  inp.type = f.type === "number" ? "number" : (f.type === "date" ? "date" : "text");
                  if (f.type === "number") { inp.step = "any"; inp.placeholder = "请输入具体数值（如：18）"; }
                }
                inp.id = "task-field-" + f.key;
                lbl.htmlFor = inp.id;
                inp.dataset.fieldKey = f.key;
                const saved = editing ? data.submission.fields[f.key] : null;
                if (saved != null) inp.value = saved === true ? "是" : saved === false ? "否" : String(saved);
                wrap.appendChild(inp);
                body.appendChild(wrap);
              });
            }
            /* 文字说明模块（复用备注输入框） */
            if (modules.includes("text")) {
              textModuleOn = true;
              const body = makeBlock(spec.text_label || "文字情况说明", "");
              const ta = document.createElement("textarea");
              document.getElementById("noteInput").removeAttribute("id");
              ta.id = "noteInput";
              ta.setAttribute("aria-label", spec.text_label || "文字情况说明");
              ta.rows = 4;
              ta.placeholder = spec.text_placeholder || "请填写补充说明…";
              body.appendChild(ta);
            }
            if (modules.includes("image")) {
              /* 2026-11-16 体验修复：accept 收窄到后端支持的图片格式（不含 HEIC——
                 iOS Safari 会因此自动把 HEIC 原图转码成 JPEG，从源头减少报错）；
                 兜底的 HEIC 预检在 change 事件里再拦一次并给友好提示。 */
              makeUploadBlock("图片上传", "最多 " + (attachmentLimits.image || 1) + " 张", "image/jpeg,image/png,image/webp,image/bmp,image/gif", true, "image");
            }
            if (modules.includes("file")) {
              makeUploadBlock("文件上传", "最多 " + (attachmentLimits.file || 1) + " 个", ".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip", false, "file");
            }
          }
          /* 只有「未勾选文字说明模块」时才显示通用备注框，避免两个输入框重复 */
          if (!h5Modules.length && data.template.allow_note && !textModuleOn) document.getElementById("noteField").style.display = "block";
          if (editing) document.getElementById("noteInput").value = data.submission.note || "";

          const dl = String(data.instance.deadline_at || "");
          const noDeadline = dl.startsWith("9999-12-31");
          const __status = data.instance.status;
          const __canResubmit = __status === "rejected" && !!data.window_open;
          if (__canResubmit) {
            const tip = document.createElement("div");
            tip.className = "locked-tip";
            tip.classList.add("warning");
            tip.textContent = data.instance.resubmit_deadline
              ? "该提交已被驳回，请按审核意见修改后重新提交（重交截止：" + data.instance.resubmit_deadline + "）。"
              : "该提交已被驳回，请按审核意见修改后重新提交。";
            if (data.instance.reject_reason) tip.textContent += " 驳回原因：" + data.instance.reject_reason;
            contentEl.insertBefore(tip, taskActions);
          } else if (!editing && __status !== "pending") {
            const LOCKED_TEXT = {
              rejected: "该提交已被驳回，且已超过重交期限，无法再提交。",
              /* 2026-11-12 任务E2：逾期/过期统一口径文案（与后端校验同句式） */
              overdue: "当前任务已过期" + (noDeadline ? "" : "（截止时间：" + dl + "）") + "，无法提交。",
              expired: "当前任务已过期" + (noDeadline ? "" : "（截止时间：" + dl + "）") + "，无法提交。",
              cancelled: "任务已关闭。",
            };
            const tip = document.createElement("div");
            tip.className = "locked-tip";
            tip.textContent = LOCKED_TEXT[__status] || (data.window_reason || "当前状态不可提交。");
            const content = document.getElementById("content");
            content.insertBefore(tip, taskActions);
            content.querySelectorAll("input, textarea, select").forEach((el) => { el.disabled = true; });
            submitBtn.disabled = true;
            submitBtn.style.display = "none";
          }

          if (!editing && !data.window_open) {
            submitBtn.disabled = true;
            showMsg(data.window_reason || "当前任务提交窗口已关闭", "error");
          }
        })
        .catch(error => {
          loadingEl.style.display = "none";
          showMsg(error.message, "error");
        });

      submitBtn.addEventListener("click", () => {
        if (!taskInfo || submitBtn.disabled) return;
        if (activeUploads) return showMsg("请等待附件上传完成", "error");
        let payload = {};
        const fieldsObj = {};
        document.querySelectorAll("[data-field-key]").forEach(el => { fieldsObj[el.dataset.fieldKey] = el.value; });
        /* 字段 + 文字说明 + 多附件一起提交（文字说明走 note，图片/文件走 refs） */
        payload = { fields: fieldsObj, refs: uploadedRefs, file_ref: uploadedRefs[0] || "" };
        const noteEl = document.getElementById("noteInput");
        const note = noteEl ? noteEl.value : "";
        /* 2026-10-30 用户口径：管理员选了什么，用户就必须完成什么 —— 缺什么先在这里提示，
           不要让用户点完提交才看到服务端报错（服务端同样有硬校验兜底）。 */
        for (const f of h5Schema) {
          if (!f || !f.required) continue;
          const el = document.querySelector('[data-field-key="' + f.key + '"]');
          if (el && !String(el.value || "").trim()) {
            return showMsg("请填写「" + (f.label || f.key) + "」后再提交", "error");
          }
        }
        if (h5Modules.indexOf("text") >= 0 && !String(note || "").trim()) {
          return showMsg("请填写文字说明后再提交", "error");
        }
        if (h5Modules.indexOf("image") >= 0 && !((refsByModule["image"] || []).length)) {
          return showMsg("请上传图片后再提交", "error");
        }
        if (h5Modules.indexOf("file") >= 0 && !((refsByModule["file"] || []).length)) {
          return showMsg("请上传文件后再提交", "error");
        }
        const idleLabel = editing ? "保存修改" : "提交任务";
        const saved = new Set((taskInfo.submission?.attachments || []).map(item => item.ref));
        const requestBody = editing ? {
          revision: taskInfo.submission.revision,
          fields: fieldsObj, note,
          retained_refs: uploadedRefs.filter(ref => saved.has(ref)),
          refs: uploadedRefs.filter(ref => !saved.has(ref)),
        } : { token, payload, note };
        submitBtn.disabled = true;
        submitBtn.textContent = editing ? "正在保存…" : "正在提交…";
        taskRequest(editing ? "/api/h5/task/save-edit" : "/api/h5/task/submit", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-H5-Token": token },
          body: JSON.stringify(requestBody)
        }).then(({ ok, data }) => {
          if (!ok) throw Error(data.message || "提交失败");
          switchView(false, editing ? "saved" : "done");
        }).catch(error => {
          submitBtn.disabled = false;
          submitBtn.textContent = idleLabel;
          showMsg(error.message, "error");
        });
      });
    })();
  </script>
</body>
</html>
