<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="referrer" content="no-referrer" />
  <title>任务提交 - IMTask</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; background: #eef2f8; color: #1f2937; padding: 14px 12px 28px; line-height: 1.55; }
    .card { max-width: 520px; margin: 0 auto; }
    .topbar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: #fff; border-radius: 14px; border: 1px solid #e3e9f2; margin-bottom: 12px; }
    .topbar .dot { width: 8px; height: 8px; border-radius: 50%; background: #2563eb; }
    .topbar .tname { font-size: 14px; font-weight: 700; color: #0f172a; }
    .topbar .chan { margin-left: auto; font-size: 12px; color: #2563eb; font-weight: 600; }
    .block { background: #fff; border: 1px solid #e3e9f2; border-radius: 14px; padding: 14px; margin-bottom: 10px; }
    .block-head { display: flex; align-items: center; gap: 7px; margin-bottom: 10px; }
    .block-head .ico { width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; border-radius: 5px; font-size: 12px; }
    .block-head .name { font-size: 14px; font-weight: 700; color: #0f172a; }
    .block-head .hint { margin-left: auto; font-size: 11px; color: #94a3b8; }
    .field label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px; }
    .field input, .field select, .field textarea { width: 100%; padding: 11px 12px; border: 1px solid #dbe3ef; border-radius: 10px; font-size: 14px; background: #f8fafc; color: #0f172a; outline: none; }
    .field input:focus, .field select:focus, .field textarea:focus { background: #fff; border-color: #2563eb; }
    .task-head { background: #fff; border: 1px solid #e3e9f2; border-radius: 14px; padding: 14px; margin-bottom: 10px; }
    .task-head .row1 { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .task-head .title { font-size: 15px; font-weight: 700; color: #0f172a; }
    .task-head .deadline { margin-left: auto; font-size: 12px; font-weight: 700; color: #b45309; background: #fffbeb; border: 1px solid #fde68a; border-radius: 7px; padding: 2px 8px; }
    .task-head .desc { font-size: 13px; color: #475569; white-space: pre-line; }
    .task-head .meta { font-size: 12px; color: #94a3b8; margin-top: 8px; }
    .upload-box { border: 1px dashed #c7d2fe; background: #f8faff; border-radius: 12px; padding: 14px; text-align: center; color: #4f46e5; font-size: 13px; font-weight: 600; cursor: pointer; display: block; }
    .upload-box input[type=file] { display: none; }
    .thumb-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .thumb { width: 76px; height: 76px; border-radius: 10px; border: 1px solid #e3e9f2; object-fit: cover; background: #f1f5f9; }
    .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; background: #2563eb; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 14px; }
    .btn:disabled { background: #94a3b8; cursor: not-allowed; }
    .msg { margin-top: 12px; padding: 11px 13px; border-radius: 10px; font-size: 13px; display: none; }
    .msg.error { display: block; background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .msg.success { display: block; background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
    .ref-list { font-size: 12px; color: #4b5563; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <div id="loading">正在加载任务信息...</div>
    <div id="content" style="display:none;">
      <div class="topbar">
        <span class="dot"></span>
        <span class="tname" id="tplName"></span>
        <span class="chan">H5 专属通道</span>
      </div>
      <div class="task-head">
        <div class="row1">
          <span class="title" id="headTitle"></span>
          <span class="deadline" id="headDeadline"></span>
        </div>
        <div class="desc" id="headDesc"></div>
        <div class="meta">提交人：<span id="memberName"></span> · 周期：<span id="periodKey"></span> · 状态：<span class="badge" id="instStatus"></span></div>
      </div>
      <div id="dynamicArea"></div>
      <div class="block" id="noteField" style="display:none;">
        <div class="block-head"><span class="ico" style="background:#ecfdf5;color:#059669">✎</span><span class="name">备注说明（选填）</span></div>
        <div class="field"><textarea id="noteInput" rows="3" placeholder="请输入补充说明"></textarea></div>
      </div>
      <button class="btn" id="submitBtn" type="button">提交上传</button>
    </div>
    <div id="msgBox" class="msg"></div>
  </div>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.hash.replace(/^#/, ""));
      const token = params.get("t") || "";
      const loadingEl = document.getElementById("loading");
      const contentEl = document.getElementById("content");
      const msgBox = document.getElementById("msgBox");
      const submitBtn = document.getElementById("submitBtn");
      let taskInfo = null;
      let uploadedRefs = [];

      function showMsg(text, type) {
        msgBox.textContent = text;
        msgBox.className = "msg " + type;
      }

      if (!token) {
        loadingEl.style.display = "none";
        showMsg("链接缺少任务令牌 (#t=...)", "error");
        return;
      }

      fetch("/api/h5/task/info", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: token })
      })
        .then(r => r.json().then(d => ({ ok: r.ok, data: d })))
        .then(({ ok, data }) => {
          loadingEl.style.display = "none";
          if (!ok) return showMsg(data.message || "任务加载失败", "error");
          taskInfo = data;
          contentEl.style.display = "block";
          document.getElementById("tplName").textContent = data.template.name;
          document.getElementById("memberName").textContent = data.instance.name_snap;
          document.getElementById("periodKey").textContent = data.instance.period_key;
          const STATUS_TEXT = { pending: "待提交", submitted: "待审核", approved: "已完成", rejected: "已驳回", overdue: "已逾期", expired: "已过期" };
          document.getElementById("instStatus").textContent = STATUS_TEXT[data.instance.status] || data.instance.status;

          /* 顶部任务卡：标题 + 截止徽章 + 提醒正文（与预览版式一致） */
          document.getElementById("headTitle").textContent = data.template.name;
          const dl = String(data.instance.deadline_at || "");
          const hhmm = dl.length >= 16 ? dl.slice(11, 16) : dl;
          document.getElementById("headDeadline").textContent = "截止 " + hhmm;
          document.getElementById("headDesc").textContent = String(data.template.text_tpl || "").replace(/\\n/g, "\n");

          const area = document.getElementById("dynamicArea");
          const spec = data.template.spec_json || {};
          const modules = Array.isArray(spec.upload_modules) && spec.upload_modules.length
            ? spec.upload_modules
            : (data.template.kind === "form" ? ["fields"] : []);
          let textModuleOn = false;

          /* 统一的模块卡片：图标 + 标题 + 右侧提示 + 内容区 */
          function makeBlock(title, icon, iconColor, hint) {
            const block = document.createElement("div");
            block.className = "block";
            const head = document.createElement("div");
            head.className = "block-head";
            const ico = document.createElement("span");
            ico.className = "ico";
            ico.textContent = icon;
            ico.style.background = iconColor[0];
            ico.style.color = iconColor[1];
            const name = document.createElement("span");
            name.className = "name";
            name.textContent = title;
            head.appendChild(ico);
            head.appendChild(name);
            if (hint) {
              const h = document.createElement("span");
              h.className = "hint";
              h.textContent = hint;
              head.appendChild(h);
            }
            block.appendChild(head);
            area.appendChild(block);
            const body = document.createElement("div");
            body.className = "field";
            block.appendChild(body);
            return body;
          }

          /* 图片 / 文件模块：可多选，逐个上传换取 ref。
             ⚠️ 每个模块各自维护自己的 ref 列表（moduleRefs），最后合并成 uploadedRefs ——
             以前共用一个数组、每次 change 都清空，导致「先选图片再选文件」会把图片丢掉。 */
          const moduleRefs = {};
          function syncRefs() {
            uploadedRefs = [];
            Object.keys(moduleRefs).forEach((k) => { uploadedRefs = uploadedRefs.concat(moduleRefs[k]); });
          }
          function makeUploadBlock(title, icon, iconColor, hint, accept, previewImages, moduleKey) {
            const body = makeBlock(title, icon, iconColor, hint);
            const label = document.createElement("label");
            label.className = "upload-box";
            label.textContent = title.indexOf("图片") >= 0 ? "＋ 拍照 / 选图" : "⇧ 点击选择手机中的表格或文档上传";
            const fileInp = document.createElement("input");
            fileInp.type = "file";
            fileInp.multiple = true;
            if (accept) fileInp.accept = accept;
            label.appendChild(fileInp);
            body.appendChild(label);
            const refList = document.createElement("div");
            refList.className = "ref-list";
            const thumbRow = document.createElement("div");
            thumbRow.className = "thumb-row";
            body.appendChild(refList);
            if (previewImages) body.appendChild(thumbRow);
            fileInp.addEventListener("change", async () => {
              const myRefs = [];
              refList.textContent = "";
              thumbRow.innerHTML = "";
              for (const f of fileInp.files) {
                const fd = new FormData();
                fd.append("token", token);
                fd.append("file", f);
                try {
                  const r = await fetch("/api/h5/task/upload", { method: "POST", body: fd });
                  const res = await r.json();
                  if (!r.ok) { showMsg(res.message || "上传失败", "error"); return; }
                  myRefs.push(res.ref);
                  const line = document.createElement("div");
                  line.textContent = "已上传：" + (res.file_name || res.ref);
                  refList.appendChild(line);
                  if (previewImages) {
                    const img = document.createElement("img");
                    img.className = "thumb";
                    img.src = URL.createObjectURL(f);
                    thumbRow.appendChild(img);
                  }
                } catch (e) {
                  showMsg("上传网络异常", "error");
                  return;
                }
              }
              moduleRefs[moduleKey] = myRefs;
              syncRefs();
            });
          }

          if (data.template.kind === "form") {
            /* 字段模块 */
            if (modules.includes("fields")) {
              const fields = Array.isArray(data.template.schema_json) ? data.template.schema_json : [];
              const body = makeBlock("数据报数填报", "#", ["#eef2ff", "#4f46e5"], "数值报数");
              fields.forEach(f => {
                const wrap = document.createElement("div");
                wrap.style.marginBottom = "10px";
                const lbl = document.createElement("label");
                lbl.textContent = f.label + (f.required ? " *" : "");
                wrap.appendChild(lbl);
                let inp;
                if (f.type === "select" && Array.isArray(f.options)) {
                  inp = document.createElement("select");
                  const empty = document.createElement("option");
                  empty.value = "";
                  empty.textContent = "请选择";
                  inp.appendChild(empty);
                  f.options.forEach(opt => {
                    const o = document.createElement("option");
                    o.value = opt;
                    o.textContent = opt;
                    inp.appendChild(o);
                  });
                } else {
                  inp = document.createElement("input");
                  inp.type = f.type === "number" ? "number" : (f.type === "date" ? "date" : "text");
                  if (f.type === "number") { inp.step = "any"; inp.placeholder = "请输入具体数值（如：18）"; }
                }
                inp.dataset.fieldKey = f.key;
                wrap.appendChild(inp);
                body.appendChild(wrap);
              });
            }
            /* 文字说明模块（复用备注输入框） */
            if (modules.includes("text")) {
              textModuleOn = true;
              const body = makeBlock(spec.text_label || "文字情况说明", "≡", ["#ecfdf5", "#059669"], "");
              const ta = document.createElement("textarea");
              ta.id = "noteInput";
              ta.rows = 4;
              ta.placeholder = spec.text_placeholder || "请填写补充说明…";
              body.appendChild(ta);
            }
            if (modules.includes("image")) {
              makeUploadBlock("图片上传（现场拍照 / 晒图）", "🖼", ["#eff6ff", "#2563eb"], "支持 JPG/PNG", "image/*", true, "image");
            }
            if (modules.includes("file")) {
              makeUploadBlock("文件附件上传", "📎", ["#f5f3ff", "#7c3aed"], "Excel / PDF / Word", "", false, "file");
            }
          } else {
            makeUploadBlock(
              data.template.kind === "image" ? "上传图片 *" : "上传文件 *",
              "📎", ["#f5f3ff", "#7c3aed"], "", data.template.kind === "image" ? "image/*" : "", data.template.kind === "image", "single",
            );
          }
          /* 只有「未勾选文字说明模块」时才显示通用备注框，避免两个输入框重复 */
          if (data.template.allow_note && !textModuleOn) document.getElementById("noteField").style.display = "block";

          if (!data.window_open) {
            submitBtn.disabled = true;
            showMsg(data.window_reason || "当前任务提交窗口已关闭", "error");
          }
        })
        .catch(() => {
          loadingEl.style.display = "none";
          showMsg("网络请求异常", "error");
        });

      submitBtn.addEventListener("click", () => {
        if (!taskInfo) return;
        let payload = {};
        const fieldsObj = {};
        document.querySelectorAll("[data-field-key]").forEach(el => { fieldsObj[el.dataset.fieldKey] = el.value; });
        /* 字段 + 文字说明 + 多附件一起提交（文字说明走 note，图片/文件走 refs） */
        payload = { fields: fieldsObj, refs: uploadedRefs, file_ref: uploadedRefs[0] || "" };
        const noteEl = document.getElementById("noteInput");
        const note = noteEl ? noteEl.value : "";
        submitBtn.disabled = true;
        fetch("/api/h5/task/submit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: token, payload: payload, note: note })
        })
          .then(r => r.json().then(d => ({ ok: r.ok, data: d })))
          .then(({ ok, data }) => {
            if (!ok) {
              submitBtn.disabled = false;
              return showMsg(data.message || "提交失败", "error");
            }
            showMsg(data.message || "提交成功！", "success");
          })
          .catch(() => {
            submitBtn.disabled = false;
            showMsg("提交网络异常", "error");
          });
      });
    })();
  </script>
</body>
</html>
