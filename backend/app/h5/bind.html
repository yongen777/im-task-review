<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="referrer" content="no-referrer" />
  <title>信息登记 - IMTask</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f4f6f9; color: #1f2937; padding: 16px; line-height: 1.5; }
    .card { max-width: 440px; margin: 24px auto; background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
    .title { font-size: 18px; font-weight: 600; margin-bottom: 8px; color: #111827; }
    .desc { font-size: 13px; color: #6b7280; margin-bottom: 18px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; }
    .field label .req { color: #dc2626; margin-left: 2px; }
    .field input, .field select { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; background: #fff; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #2563eb; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn:disabled { background: #9ca3af; cursor: not-allowed; }
    .msg { margin-top: 14px; padding: 10px 12px; border-radius: 8px; font-size: 13px; display: none; }
    .msg.error { display: block; background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .msg.success { display: block; background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">信息登记</div>
    <div class="desc">请填写姓名、手机号码与部门完成登记。登记后由管理员为你分配业务角色，即可接收任务提醒。</div>
    <div class="field">
      <label for="nameInput">姓名<span class="req">*</span></label>
      <input id="nameInput" type="text" maxlength="20" placeholder="请输入真实姓名" />
    </div>
    <div class="field">
      <label for="phoneInput">手机号码<span class="req">*</span></label>
      <input id="phoneInput" type="tel" maxlength="11" placeholder="请输入 11 位手机号" />
    </div>
    <div class="field">
      <label for="deptSelect">部门<span class="req">*</span></label>
      <select id="deptSelect">
        <option value="">加载部门选项中…</option>
      </select>
    </div>
    <button class="btn" id="bindBtn" type="button">提交登记</button>
    <div id="msgBox" class="msg"></div>
  </div>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.hash.replace(/^#/, ""));
      const externalId = params.get("uid") || params.get("u") || params.get("external_id") || "";
      const platform = params.get("plat") || params.get("platform") || "";
      const nameInput = document.getElementById("nameInput");
      const phoneInput = document.getElementById("phoneInput");
      const deptSelect = document.getElementById("deptSelect");
      const bindBtn = document.getElementById("bindBtn");
      const msgBox = document.getElementById("msgBox");

      function showMsg(text, type) {
        msgBox.textContent = text;
        msgBox.className = "msg " + type;
      }

      /* 2026-11-03：已登记/已提交后整页锁定，防退出重进后重复提交覆盖 */
      function lockForm(text) {
        nameInput.disabled = true;
        phoneInput.disabled = true;
        deptSelect.disabled = true;
        bindBtn.disabled = true;
        bindBtn.textContent = "已提交";
        showMsg(text, "success");
      }

      // 打开页面先查：该账号是否已登记（已绑定 / 已提交待分配）→ 直接锁定
      if (externalId) {
        fetch("/api/h5/bind/status?uid=" + encodeURIComponent(externalId) + "&platform=" + encodeURIComponent(platform))
          .then(function (r) { return r.json(); })
          .then(function (d) {
            if (!d || !d.registered) return;
            if (d.bound) {
              lockForm("你已完成登记" + (d.phone_masked ? "（" + d.phone_masked + "）" : "") + "，无需重复提交。");
            } else {
              lockForm("你已提交登记" + (d.name ? "（" + d.name + "）" : "") + "，请等待管理员分配业务角色，无需重复提交。");
            }
          })
          .catch(function () { /* 查询失败不阻塞填写 */ });
      }

      // 部门选项由后台管理员配置；未配置时给出明确提示
      fetch("/api/h5/departments")
        .then(function (r) { return r.json(); })
        .then(function (d) {
          var items = (d && d.items) || [];
          deptSelect.innerHTML = "";
          if (!items.length) {
            var opt = document.createElement("option");
            opt.value = "";
            opt.textContent = "暂无可选部门，请联系管理员配置";
            deptSelect.appendChild(opt);
            deptSelect.disabled = true;
            return;
          }
          var placeholder = document.createElement("option");
          placeholder.value = "";
          placeholder.textContent = "请选择部门";
          deptSelect.appendChild(placeholder);
          items.forEach(function (it) {
            var o = document.createElement("option");
            o.value = it.name;
            o.textContent = it.name;
            deptSelect.appendChild(o);
          });
        })
        .catch(function () {
          deptSelect.innerHTML = "";
          var opt = document.createElement("option");
          opt.value = "";
          opt.textContent = "部门选项加载失败，请刷新重试";
          deptSelect.appendChild(opt);
        });

      bindBtn.addEventListener("click", function () {
        var name = nameInput.value.trim();
        var phone = phoneInput.value.trim();
        var dept = deptSelect.value;
        if (!name) return showMsg("请填写姓名", "error");
        if (!/^1[3-9]\d{9}$/.test(phone)) return showMsg("请输入合法的 11 位大陆手机号", "error");
        if (!dept) return showMsg("请选择部门", "error");
        if (!externalId) return showMsg("链接缺少用户标识 (#uid=...)", "error");
        bindBtn.disabled = true;
        fetch("/api/h5/bind", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ phone: phone, external_id: externalId, name: name, dept: dept, platform: platform })
        })
          .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
          .then(function (res) {
            if (!res.ok) {
              bindBtn.disabled = false;
              return showMsg(res.data.message || "提交失败", "error");
            }
            lockForm(res.data.message || "提交成功");
          })
          .catch(function () {
            bindBtn.disabled = false;
            showMsg("网络异常，请稍后重试", "error");
          });
      });
    })();
  </script>
</body>
</html>
