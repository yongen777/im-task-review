<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="referrer" content="no-referrer" />
  <title>信息登记 - IMTask</title>
  <style>
    :root {
      --blue: #15558a;
      --ink: #182530;
      --secondary: #485761;
      --muted: #596876;
      --paper: #fff;
      --canvas: #f3f5f7;
      --line: #d5dde4;
      --selection: #edf4fa;
      --panel: 12px;
      --control: 8px;
      font: 400 16px/1.55 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
      background: var(--canvas);
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    h1, h2, h3, strong { font-weight: 600; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { opacity: .55; cursor: default; }
    :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .btn, .primary, .secondary {
      min-height: 44px; padding: 8px 16px; border: 1px solid transparent;
      border-radius: var(--control); background: var(--blue); color: white; font-weight: 500;
    }
    .secondary { background: var(--paper); border-color: var(--line); color: var(--blue); }
    .btn:active, .primary:active { background: #10436e; }
    .secondary:active { background: var(--selection); }
    .icon { width: 18px; height: 18px; flex: none; vertical-align: middle; }
    .field label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 500; }
    .field input:not([type=file]), .field select, .field textarea {
      width: 100%; min-height: 44px; padding: 8px 12px; border: 1px solid var(--line);
      border-radius: var(--control); background: var(--paper);
    }
    .field textarea { resize: vertical; }
    .msg { display: none; margin-top: 12px; padding: 12px; border: 1px solid var(--line); border-radius: var(--control); font-size: 14px; }
    .msg.error { display: block; background: #fff3f1; color: #972e27; }
    .msg.success { display: block; background: #edf7f2; color: #1b644e; }
    body { padding: 16px 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
    .card { max-width: 480px; margin: 0 auto; padding: 20px; background: var(--paper); border: 1px solid var(--line); border-radius: var(--panel); }
    .title { font-size: 24px; margin: 0 0 8px; }
    .desc { font-size: 14px; color: var(--secondary); margin: 0 0 24px; }
    .field { margin-bottom: 16px; }
    .req { color: #972e27; margin-left: 4px; }
    .btn { width: 100%; }
  </style>
</head>
<body>
  <div class="card">
    <h1 class="title">信息登记</h1>
    <div class="desc">请填写姓名、手机号码与部门完成登记。登记后由管理员为你分配业务角色，即可接收任务提醒。</div>
    <div class="field">
      <label for="nameInput">姓名<span class="req">*</span></label>
      <input id="nameInput" type="text" maxlength="20" placeholder="请输入真实姓名" />
    </div>
    <div class="field">
      <label for="phoneInput">手机号码<span class="req">*</span></label>
      <input id="phoneInput" type="tel" maxlength="11" placeholder="请输入 11 位手机号" />
    </div>
    <div class="field">
      <label for="deptSelect">部门<span class="req">*</span></label>
      <select id="deptSelect">
        <option value="">加载部门选项中…</option>
      </select>
    </div>
    <button class="btn" id="bindBtn" type="button">提交登记</button>
    <div id="msgBox" class="msg" role="status"></div>
  </div>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.hash.replace(/^#/, ""));
      const externalId = params.get("uid") || params.get("u") || params.get("external_id") || "";
      const platform = params.get("plat") || params.get("platform") || "";
      const nameInput = document.getElementById("nameInput");
      const phoneInput = document.getElementById("phoneInput");
      const deptSelect = document.getElementById("deptSelect");
      const bindBtn = document.getElementById("bindBtn");
      const msgBox = document.getElementById("msgBox");

      function showMsg(text, type) {
        msgBox.textContent = text;
        msgBox.className = "msg " + type;
      }

      /* 2026-11-03：已登记/已提交后整页锁定，防退出重进后重复提交覆盖 */
      function lockForm(text) {
        nameInput.disabled = true;
        phoneInput.disabled = true;
        deptSelect.disabled = true;
        bindBtn.disabled = true;
        bindBtn.textContent = "已提交";
        showMsg(text, "success");
      }

      // 打开页面先查：该账号是否已登记（已绑定 / 已提交待分配）→ 直接锁定
      if (externalId) {
        fetch("/api/h5/bind/status?uid=" + encodeURIComponent(externalId) + "&platform=" + encodeURIComponent(platform))
          .then(function (r) { return r.json(); })
          .then(function (d) {
            if (!d || !d.registered) return;
            if (d.bound) {
              lockForm("你已完成登记" + (d.phone_masked ? "（" + d.phone_masked + "）" : "") + "，无需重复提交。");
            } else {
              lockForm("你已提交登记" + (d.name ? "（" + d.name + "）" : "") + "，请等待管理员分配业务角色，无需重复提交。");
            }
          })
          .catch(function () { /* 查询失败不阻塞填写 */ });
      }

      // 部门选项由后台管理员配置；未配置时给出明确提示
      fetch("/api/h5/departments")
        .then(function (r) { return r.json(); })
        .then(function (d) {
          var items = (d && d.items) || [];
          deptSelect.innerHTML = "";
          if (!items.length) {
            var opt = document.createElement("option");
            opt.value = "";
            opt.textContent = "暂无可选部门，请联系管理员配置";
            deptSelect.appendChild(opt);
            deptSelect.disabled = true;
            return;
          }
          var placeholder = document.createElement("option");
          placeholder.value = "";
          placeholder.textContent = "请选择部门";
          deptSelect.appendChild(placeholder);
          items.forEach(function (it) {
            var o = document.createElement("option");
            o.value = it.name;
            o.textContent = it.name;
            deptSelect.appendChild(o);
          });
        })
        .catch(function () {
          deptSelect.innerHTML = "";
          var opt = document.createElement("option");
          opt.value = "";
          opt.textContent = "部门选项加载失败，请刷新重试";
          deptSelect.appendChild(opt);
        });

      bindBtn.addEventListener("click", function () {
        var name = nameInput.value.trim();
        var phone = phoneInput.value.trim();
        var dept = deptSelect.value;
        if (!name) return showMsg("请填写姓名", "error");
        if (!/^1[3-9]\d{9}$/.test(phone)) return showMsg("请输入合法的 11 位大陆手机号", "error");
        if (!dept) return showMsg("请选择部门", "error");
        if (!externalId) return showMsg("链接缺少用户标识 (#uid=...)", "error");
        bindBtn.disabled = true;
        fetch("/api/h5/bind", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ phone: phone, external_id: externalId, name: name, dept: dept, platform: platform })
        })
          .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
          .then(function (res) {
            if (!res.ok) {
              bindBtn.disabled = false;
              return showMsg(res.data.message || "提交失败", "error");
            }
            lockForm(res.data.message || "提交成功");
          })
          .catch(function () {
            bindBtn.disabled = false;
            showMsg("网络异常，请稍后重试", "error");
          });
      });
    })();
  </script>
</body>
</html>
