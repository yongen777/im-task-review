<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>个人任务工作台</title>
<style>
    :root {
      --blue: #15558a;
      --ink: #182530;
      --secondary: #485761;
      --muted: #596876;
      --paper: #fff;
      --canvas: #f3f5f7;
      --line: #d5dde4;
      --selection: #edf4fa;
      --panel: 12px;
      --control: 8px;
      font: 400 16px/1.55 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
      background: var(--canvas);
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    h1, h2, h3, strong { font-weight: 600; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { opacity: .55; cursor: default; }
    :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .btn, .primary, .secondary {
      min-height: 44px; padding: 8px 16px; border: 1px solid transparent;
      border-radius: var(--control); background: var(--blue); color: white; font-weight: 500;
    }
    .secondary { background: var(--paper); border-color: var(--line); color: var(--blue); }
    .btn:active, .primary:active { background: #10436e; }
    .secondary:active { background: var(--selection); }
    .icon { width: 18px; height: 18px; flex: none; vertical-align: middle; }
    header { background: var(--paper); border-top: 4px solid var(--blue); }
    header div, main, nav { max-width: 800px; margin: auto; }
    header div { padding: 16px 16px 12px; }
    header small { color: var(--secondary); font-size: 13px; }
    h1 { font-size: 24px; margin: 4px 0 0; }
    h2 { font-size: 18px; margin: 0; }
    h3 { font-size: 17px; margin: 0; overflow-wrap: anywhere; }
    nav { display: flex; position: sticky; top: 0; z-index: 2; background: var(--paper); border-bottom: 1px solid var(--line); }
    nav button { flex: 1; min-height: 48px; padding: 8px 4px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--secondary); font-size: 15px; }
    nav button.active { color: var(--blue); background: var(--selection); border-bottom-color: var(--blue); font-weight: 500; }
    nav button:focus-visible { outline-offset: -4px; }
    main { padding: 16px 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
    .card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--panel); padding: 16px; margin-bottom: 12px; }
    .task-card { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; }
    .task-card p { margin: 4px 0 0; }
    .muted { color: var(--muted); font-size: 14px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
    .section-row { margin-bottom: 12px; }
    .empty { padding: 24px 16px; color: var(--secondary); }
    label.field, .field-label { display: block; margin: 16px 0 8px; font-size: 14px; font-weight: 500; }
    input:not([type=checkbox]), select, textarea { width: 100%; min-width: 0; min-height: 44px; padding: 8px 12px; border: 1px solid var(--line); background: var(--paper); border-radius: var(--control); }
    textarea { min-height: 88px; resize: vertical; }
    input[type=checkbox] { width: 20px; height: 20px; flex: none; margin: 0; accent-color: var(--blue); }
    .choice { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 4px 0; font-size: 14px; overflow-wrap: anywhere; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .scope { max-height: 360px; overflow: auto; border: 1px solid var(--line); padding: 0 12px; border-radius: var(--control); }
    details > summary { cursor: pointer; min-height: 44px; padding: 12px 0; overflow-wrap: anywhere; }
    .branch, .member-section, .member-detail { border-top: 1px solid var(--line); }
    .branch > div { margin-left: 8px; padding-left: 8px; border-left: 1px solid var(--line); }
    .form-actions { position: sticky; bottom: 0; margin-top: 16px; padding: 8px 0 calc(8px + env(safe-area-inset-bottom, 0px)); background: var(--paper); border-top: 1px solid var(--line); }
    .toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px); background: var(--ink); color: white; border-radius: var(--control); padding: 12px 16px; z-index: 10; }
    .period-label { display: block; margin: 12px 0 4px; color: var(--secondary); font-size: 14px; }
    .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: var(--selection); padding: 12px; border-radius: var(--control); margin: 12px 0; }
    .kpis span { font-size: 13px; }
    .kpis strong { display: block; font-size: 24px; }
    .progress { display: block; width: 100%; height: 8px; accent-color: var(--blue); margin-bottom: 12px; }
    .member-detail p { margin: 0 0 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .attachments { display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 12px; }
    .preview { width: min(680px, calc(100% - 32px)); max-height: 88vh; padding: 16px; border: 1px solid var(--line); border-radius: var(--panel); }
    .preview::backdrop { background: #182530b3; }
    .preview img { display: block; width: 100%; max-height: 68vh; object-fit: contain; margin-top: 12px; }
    .hidden { display: none !important; }
</style></head><body><header><div><small>德阳量密助手</small><h1>个人任务工作台</h1></div></header><nav aria-label="工作台页签"><button data-tab="todo" class="active">我的待办</button><button data-tab="adhoc">自主上报</button><button data-tab="create">创建任务</button></nav><main id="main" aria-live="polite">正在加载工作台…</main><div id="toast" class="toast hidden" role="status"></div>
<dialog class="preview" id="attachment-preview" aria-label="提交图片预览">
  <form method="dialog"><button class="secondary">关闭预览</button></form>
  <img alt="员工提交图片">
</dialog>
<script>
'use strict';
const token=new URLSearchParams(location.hash.slice(1)).get('t')||'',prefix=location.pathname.split('/h5/')[0];
let toastTimer;
let info=null,tab='todo',scope=null,busy=false,selected=new Set(),expired=false;
const main=document.getElementById('main'),toastBox=document.getElementById('toast');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(text){toastBox.textContent=text;toastBox.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastBox.classList.add('hidden'),3500)}
function expiry(){expired=true;const preview=document.getElementById('attachment-preview');if(preview.open)preview.close();main.innerHTML='<div class="card empty"><h2>链接已过期</h2><p>请回到聊天框向机器人发送任意消息，重新获取最新工作台入口。</p></div>'}
async function api(action,data={},blob=false){const r=await fetch(prefix+'/api/h5/portal/'+action,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(data),cache:'no-store'});if(r.status===401){expiry();throw Error('链接已过期')}if(blob&&r.ok)return r.blob();const v=await r.json();if(!r.ok)throw Error(v.message||'请求失败');return v}
async function refresh(render=true){try{info=await api('info');if(render)show()}catch(e){if(!expired){main.textContent='加载失败';toast(e.message)}}}
function show() {
  if (expired || !info) return;
  if (tab === 'create') { creator(); return; }
  const todo = tab === 'todo';
  const rows = todo ? info.todos : info.adhoc;
  const focusKey = document.activeElement?.dataset.open;
  main.innerHTML =
    '<div class="row section-row"><h2>' + (todo ? '当前可提交任务' : '自主上报事项') +
    '</h2><span class="muted">' + rows.length + ' 项</span></div>' +
    (rows.length ? rows.map(row => {
      const key = todo ? row.id : row.template_id;
      const deadline = todo ? '<p class="muted">截止 ' + esc(row.deadline_at.startsWith('9999') ? '不限' : row.deadline_at) + '</p>' : '';
      return '<article class="card task-card"><div><h3>' + esc(row.template_name || row.name) +
        '</h3>' + deadline + '</div><button class="primary" data-open="' + esc(key) + '">' +
        (todo ? '去完成' : '进入上报') + '</button></article>';
    }).join('') : '<div class="card empty">' +
      (todo ? '当前暂无待提交的任务事项' : '当前暂无可自主上报的任务事项') + '</div>');
  main.querySelectorAll('[data-open]').forEach((button, index) => {
    if (focusKey === button.dataset.open) button.focus({ preventScroll: true });
    button.onclick = async () => {
      button.disabled = true;
      try {
        const item = rows[index];
        const result = await api(todo ? 'open' : 'adhoc', todo ? { instance_id: item.id } : { template_id: item.template_id });
        location.href = prefix + result.url;
      } catch (error) {
        toast(error.message);
        button.disabled = false;
      }
    };
  });
}

const tabs = document.querySelectorAll('[data-tab]');
tabs.forEach(button => {
  button.setAttribute('aria-pressed', String(button.classList.contains('active')));
  button.onclick = () => {
    if (expired || !info) return;
    if (button.dataset.tab === 'create' && !info.can_create) {
      toast('您还未开放此权限，具体请找相关管理员');
      return;
    }
    if (tab === button.dataset.tab) return;
    tab = button.dataset.tab;
    tabs.forEach(item => {
      item.classList.toggle('active', item === button);
      item.setAttribute('aria-pressed', String(item === button));
    });
    show();
  };
});

async function creator() {
  main.innerHTML = '<div class="row section-row"><h2>我发布的任务</h2>' +
    '<button id="new" class="primary">新建并发布任务</button></div><div id="tasks">正在加载统计…</div>';
  document.getElementById('new').onclick = form;
  await stats();
}

function renderPeriod(container, task, period, opened) {
  const now = new Date().toLocaleString('sv-SE', { timeZone: 'Asia/Shanghai' });
  container.innerHTML = '<div class="kpis"><span>应交<strong>' + period.expected +
    '</strong></span><span>已交<strong>' + period.submitted + '</strong></span><span>未交<strong>' +
    period.pending + '</strong></span></div><progress class="progress" aria-label="收集进度" value="' +
    period.submitted + '" max="' + Math.max(period.expected, 1) + '"></progress>' + period.members.map(member => {
      const status = member.status === 'approved' ? '已完成' : member.deadline_at < now ? '已逾期' : '未提交';
      const submission = member.submission;
      const content = submission ? '<p>' + esc(submission.note || '') + '</p><div class="attachments">' +
        refs(submission).map((ref, index) => '<button class="secondary" data-ref="' + esc(ref) +
          '">查看图片 ' + (index + 1) + '</button>').join('') + '</div>' : '<p class="muted">暂无提交内容</p>';
      return '<details class="member-detail" data-member="' + esc(member.id) + '"' +
        (opened.has(String(member.id)) ? ' open' : '') + '><summary>' +
        esc(member.name_snap) + ' · ' + status + '</summary>' + content + '</details>';
    }).join('');
  container.querySelectorAll('[data-ref]').forEach(button => {
    button.onclick = async () => {
      button.disabled = true;
      try {
        const blob = await api('attachment', { task_id: task.task_id, ref: button.dataset.ref }, true);
        const dialog = document.getElementById('attachment-preview');
        const url = URL.createObjectURL(blob);
        if (typeof dialog.showModal !== 'function') {
          const link = document.createElement('a');
          link.href = url;
          link.target = '_blank';
          link.rel = 'noopener';
          link.textContent = '打开图片';
          button.replaceWith(link);
          window.addEventListener('pagehide', () => URL.revokeObjectURL(url), { once: true });
          return;
        }
        const img = dialog.querySelector('img');
        img.src = url;
        dialog.addEventListener('close', () => {
          img.removeAttribute('src');
          URL.revokeObjectURL(url);
        }, { once: true });
        dialog.showModal();
      } catch (error) {
        toast(error.message);
      } finally {
        button.disabled = false;
      }
    };
  });
}

async function stats() {
  const el = document.getElementById('tasks');
  try {
    const result = await api('tasks');
    if (!el || !el.isConnected) return;
    const now = new Date().toLocaleString('sv-SE', { timeZone: 'Asia/Shanghai' });
    const overdue = result.items.map(task => task.periods.map(period =>
      period.members.map(member => member.status !== 'approved' && member.deadline_at < now)));
    const snapshot = JSON.stringify([result.items, overdue]);
    if (el.dataset.snapshot === snapshot) return;
    el.dataset.snapshot = snapshot;
    const previous = new Map([...el.querySelectorAll('[data-period-task]')].map(select => [
      select.dataset.periodTask,
      { period: select.value, opened: new Set([...select.closest('article').querySelectorAll('[data-member][open]')]
        .map(detail => detail.dataset.member)) }
    ]));
    el.innerHTML = result.items.map(task => '<article class="card"><h3>' + esc(task.name) +
      (task.periods.length ? '</h3><label class="period-label">统计周期<select data-period-task="' +
        esc(task.task_id) + '">' + task.periods.map(period => '<option value="' + esc(period.period_key) + '">' +
          esc(period.period_key === 'once' ? '一次性任务' : period.period_key) + '</option>').join('') +
        '</select></label><div data-period-panel></div>' : '</h3><p class="muted">等待首个执行周期</p>') +
      '</article>').join('') || '<div class="card empty">还没有发布任务</div>';
    const tasks = new Map(result.items.map(task => [task.task_id, task]));
    el.querySelectorAll('[data-period-task]').forEach(select => {
      const task = tasks.get(select.dataset.periodTask);
      const saved = previous.get(task.task_id);
      if (saved && task.periods.some(period => period.period_key === saved.period)) select.value = saved.period;
      const panel = select.closest('article').querySelector('[data-period-panel]');
      const render = opened => renderPeriod(panel, task, task.periods.find(period => period.period_key === select.value), opened);
      select.onchange = () => render(new Set());
      render(saved?.opened || new Set());
    });
  } catch (error) { toast(error.message); }
}
function refs(s){try{return JSON.parse(s.refs_json||'[]')}catch{return []}}
async function form() {
  const view = document.getElementById('tasks');
  const trigger = document.getElementById('new');
  trigger.disabled = true;
  try {
    scope = await api('recipients');
  } catch (error) {
    toast(error.message);
    return;
  } finally {
    trigger.disabled = false;
  }
  if (!view.isConnected || expired) return;
  selected.clear();
  // getRandomValues also works in the HTTP WebViews used by the portal.
  const requestId = Array.from(crypto.getRandomValues(new Uint8Array(16)),
    byte => byte.toString(16).padStart(2, '0')).join('');
  main.innerHTML = `<form class="card" id="form">
    <h2>新建任务</h2>
    <label class="field" for="name">任务名称</label>
    <input id="name" required maxlength="128" placeholder="请输入任务名称">
    <label class="field" for="description">任务要求</label>
    <textarea id="description" required maxlength="2000" placeholder="说明需要提交的文本和图片内容"></textarea>
    <div class="field-label">接收成员 <span class="muted" id="count" role="status">已选 0 人</span></div>
    <div class="scope" id="scope"></div>
    <label class="field" for="mode">发布周期</label>
    <select id="mode"><option value="once">一次性 · 立即推送</option><option value="day">每日</option><option value="week">每周</option><option value="month">每月</option></select>
    <div id="once">
    <label class="field" for="deadline_at">截止时间（留空不限）</label>
    <input type="datetime-local" id="deadline_at"></div>
    <div id="recurring" class="hidden">
    <label class="field" for="remind_at">执行时刻</label>
    <input type="time" id="remind_at" value="08:00">
    <div id="weekly" class="hidden">
    <label class="field" for="weekday">执行星期（1–7，周一至周日）</label>
    <input type="number" id="weekday" min="1" max="7" value="1"></div>
    <div id="monthly" class="hidden">
    <label class="field" for="dom">每月执行日（1–31）</label>
    <input type="number" id="dom" min="1" max="31" value="1"></div>
    <label class="choice">
    <input type="checkbox" id="has_deadline" checked>设置动态截止</label>
    <div class="grid">
    <select id="deadline_type" aria-label="截止日期规则"><option value="same_day">执行当天</option><option value="weekend">本周末</option><option value="month_end">本月底</option></select>
    <input type="time" id="deadline_time" aria-label="截止时刻" value="23:59"></div></div>
    <div class="field-label">收集内容（至少选择一项）</div>
    <label class="choice">
    <input type="checkbox" id="collect_text" checked>文字说明</label>
    <label class="choice">
    <input type="checkbox" id="collect_image">图片</label>
    <p class="muted">固定免审，提交即完成。</p>
    <div class="row form-actions">
    <button class="secondary" type="button" id="back">返回统计</button>
    <button type="submit" class="primary" id="publish">发布任务</button></div></form>`;
  const box = document.getElementById('scope');
  const departments = scope.departments;
  const deptIds = new Set(departments.map(dept => dept.dept_id));
  const children = new Map();
  departments.forEach(dept => {
    const parent = deptIds.has(dept.parent_id) ? dept.parent_id : '';
    if (!children.has(parent)) children.set(parent, []);
    children.get(parent).push(dept);
  });
  function memberRows(members) {
    return members.map(member => '<label class="choice"><input type="checkbox" data-phone="' +
      esc(member.phone) + '">' + esc(member.name) + ' <span class="muted">' +
      esc(member.phone.slice(0, 3) + '****' + member.phone.slice(-4)) + '</span></label>').join('');
  }
  function groupToggle(members, label) {
    return '<label class="choice"><input type="checkbox" data-group="' +
      esc(members.map(member => member.phone).join(',')) + '"' + (members.length ? '' : ' disabled') +
      '>' + esc(label) + '</label>';
  }
  function branchIds(id) {
    return [id, ...(children.get(id) || []).flatMap(dept => branchIds(dept.dept_id))];
  }
  function departmentBranch(dept) {
    const ids = new Set(branchIds(dept.dept_id));
    const members = scope.members.filter(member => member.dept_ids.some(id => ids.has(id)));
    const direct = members.filter(member => member.dept_ids.includes(dept.dept_id));
    return '<details class="branch"><summary>' + esc(dept.name) + ' · ' + members.length +
      ' 人</summary><div>' + groupToggle(members, '全选本部门及下级') + memberRows(direct) +
      (children.get(dept.dept_id) || []).map(departmentBranch).join('') + '</div></details>';
  }
  box.innerHTML = (departments.length ? '<details open><summary>按部门选择</summary>' +
    (children.get('') || []).map(departmentBranch).join('') + '</details>' : '') +
    (scope.roles.length ? '<details class="member-section"><summary>按角色选择</summary>' +
      scope.roles.map(role => {
        const members = scope.members.filter(member => member.role_ids.includes(role.role_id));
        return '<details class="branch"><summary>' + esc(role.name) + ' · ' + members.length +
          ' 人</summary><div>' + groupToggle(members, '全选本角色') + memberRows(members) + '</div></details>';
      }).join('') + '</details>' : '') +
    '<details class="member-section"' + (!departments.length && !scope.roles.length ? ' open' : '') +
    '><summary>全部可选成员 · ' + scope.members.length + ' 人</summary>' +
    memberRows(scope.members) + '</details>';
  function sync() {
    box.querySelectorAll('[data-phone]').forEach(input => {
      input.checked = selected.has(input.dataset.phone);
    });
    box.querySelectorAll('[data-group]').forEach(input => {
      const phones = input.dataset.group.split(',').filter(Boolean);
      input.checked = phones.length > 0 && phones.every(phone => selected.has(phone));
      input.indeterminate = !input.checked && phones.some(phone => selected.has(phone));
    });
    document.getElementById('count').textContent = '已选 ' + selected.size + ' 人';
  }
  box.onchange = event => {
    const input = event.target;
    const phones = input.dataset.phone ? [input.dataset.phone] : (input.dataset.group || '').split(',').filter(Boolean);
    phones.forEach(phone => {
      if (input.checked) selected.add(phone);
      else selected.delete(phone);
    });
    sync();
  };
  document.getElementById('back').onclick = creator;
  document.getElementById('mode').onchange = event => {
    const mode = event.target.value;
    document.getElementById('once').classList.toggle('hidden', mode !== 'once');
    document.getElementById('recurring').classList.toggle('hidden', mode === 'once');
    document.getElementById('weekly').classList.toggle('hidden', mode !== 'week');
    document.getElementById('monthly').classList.toggle('hidden', mode !== 'month');
  };
  document.getElementById('form').onsubmit = async event => {
    event.preventDefault();
    if (busy) return;
    const val = id => document.getElementById(id).value;
    const mode = val('mode');
    const data = {
      upload_modules: [
        ...(document.getElementById('collect_text').checked ? ['text'] : []),
        ...(document.getElementById('collect_image').checked ? ['image'] : []),
      ],
      request_id: requestId,
      name: val('name'),
      description: val('description'),
      phones: [...selected],
      mode,
      deadline_at: val('deadline_at'),
      remind_at: val('remind_at'),
      has_deadline: document.getElementById('has_deadline').checked,
      deadline_type: val('deadline_type'),
      deadline_time: val('deadline_time'),
    };
    if (mode === 'week') data.anchor_weekday = +val('weekday');
    if (mode === 'month') data.anchor_dom = +val('dom');
    busy = true;
    document.getElementById('publish').disabled = true;
    try {
      await api('create', data);
      toast('任务已发布');
      await creator();
    } catch (error) {
      toast(error.message);
    } finally {
      busy = false;
      const button = document.getElementById('publish');
      if (button) button.disabled = false;
    }
  };
}
refresh();setInterval(()=>{if(document.hidden||expired)return;if(tab==='create'){if(document.getElementById('tasks'))stats();else refresh(false)}else refresh()},30000);window.addEventListener('pageshow',()=>{if(!expired&&tab!=='create')refresh()});
</script></body></html>
