<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>个人任务工作台</title>
<style>
:root{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#192b41;background:#f2f5f9}*{box-sizing:border-box}body{margin:0}header{background:#123f72;color:white;padding:28px 22px 30px}header div,main,nav{max-width:780px;margin:auto}header small{letter-spacing:2px;color:#b9d4ee}h1{font-size:25px;margin:10px 0}p{line-height:1.6}nav{display:flex;background:white;position:sticky;top:0;z-index:2;border-bottom:1px solid #dce4ee}nav button{flex:1;border:0;border-bottom:3px solid transparent;padding:18px 4px;background:white;color:#57677c;font-size:15px}nav button.active{color:#145b9e;border-color:#145b9e;font-weight:700}main{padding:20px 16px 50px}button{cursor:pointer}button.primary{background:#145b9e;color:white;border:0;border-radius:8px;padding:12px 18px}button:disabled{opacity:.5;cursor:wait}.card{background:white;border:1px solid #e0e7ef;border-radius:12px;padding:20px;margin-bottom:12px}.card h3{font-size:17px;margin:0 0 10px}.muted{color:#708197;font-size:13px}.row{display:flex;gap:12px;align-items:center;justify-content:space-between}.empty{text-align:center;padding:55px 18px;color:#708197}label.field{display:block;margin:17px 0 8px;font-size:14px;font-weight:600}input:not([type=checkbox]),select,textarea{width:100%;padding:12px;border:1px solid #cdd8e5;background:white;color:inherit;border-radius:7px;font:inherit}textarea{min-height:90px}input[type=checkbox]{width:18px;height:18px;accent-color:#145b9e}.choice{display:flex;align-items:center;gap:8px;padding:9px 0;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.scope{max-height:320px;overflow:auto;border:1px solid #dce4ee;padding:12px;border-radius:8px}.toast{position:fixed;bottom:35px;left:50%;transform:translateX(-50%);max-width:90%;background:#172d45;color:white;border-radius:8px;padding:14px 20px;z-index:10;box-shadow:0 4px 25px #0003}.badge{color:#216f59;background:#e8f5ef;border-radius:5px;padding:4px 8px;font-size:12px}details{margin:12px 0}summary{cursor:pointer}.kpis{display:flex;gap:12px;background:#f4f7fb;padding:14px;border-radius:8px;margin:12px 0}.kpis span{flex:1;font-size:13px}.kpis strong{display:block;font-size:23px;margin-top:4px}img.attachment{max-width:100%;max-height:340px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-family:inherit}.hidden{display:none!important}
</style></head><body><header><div><small>德阳量密助手</small><h1>个人任务工作台</h1><span style="color:#c6dbef;font-size:14px">待办处理 · 自主上报 · 任务协作</span></div></header><nav aria-label="工作台页签"><button data-tab="todo" class="active">我的待办</button><button data-tab="adhoc">自主上报</button><button data-tab="create">创建任务</button></nav><main id="main" aria-live="polite">正在加载工作台…</main><div id="toast" class="toast hidden" role="status"></div>
<script>
'use strict';
const token=new URLSearchParams(location.hash.slice(1)).get('t')||'',prefix=location.pathname.split('/h5/')[0];
let info=null,tab='todo',scope=null,busy=false,requestId=crypto.randomUUID(),selected=new Set(),expired=false;
const main=document.getElementById('main'),toastBox=document.getElementById('toast');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(text){toastBox.textContent=text;toastBox.classList.remove('hidden');setTimeout(()=>toastBox.classList.add('hidden'),3500)}
function expiry(){expired=true;main.innerHTML='<div class="card empty"><h2>链接已过期</h2><p>请回到聊天框向机器人发送任意消息，重新获取最新工作台入口。</p></div>'}
async function api(action,data={},blob=false){const r=await fetch(prefix+'/api/h5/portal/'+action,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(data),cache:'no-store'});if(r.status===401){expiry();throw Error('链接已过期')}if(blob&&r.ok)return r.blob();const v=await r.json();if(!r.ok)throw Error(v.message||'请求失败');return v}
async function refresh(render=true){try{info=await api('info');if(render)show()}catch(e){if(!expired){main.textContent='加载失败';toast(e.message)}}}
function show(){if(expired||!info)return;if(tab==='create'){creator();return}const rows=tab==='todo'?info.todos:info.adhoc;main.innerHTML='<div class="row" style="margin-bottom:16px"><b>'+ (tab==='todo'?'当前可提交任务':'自主上报事项')+'</b><span class="muted">'+rows.length+' 项</span></div>'+ (rows.length?rows.map((r,i)=>'<article class="card"><div class="row"><h3>'+esc(r.template_name||r.name)+'</h3><span class="badge">'+(tab==='todo'?'待提交':'随时上报')+'</span></div><p class="muted">'+(tab==='todo'?'截止：'+esc(r.deadline_at.startsWith('9999')?'不限':r.deadline_at):'点击进入填报页，每次上报独立记录')+'</p><button class="primary" data-open="'+i+'">'+(tab==='todo'?'填写并提交':'进入上报')+'</button></article>').join(''):'<div class="card empty">'+(tab==='todo'?'当前暂无待提交的任务事项':'当前暂无可自主上报的任务事项')+'</div>');main.querySelectorAll('[data-open]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{const item=rows[+b.dataset.open],r=await api(tab==='todo'?'open':'adhoc',tab==='todo'?{instance_id:item.id}:{template_id:item.template_id});location.href=prefix+r.url}catch(e){toast(e.message);b.disabled=false}})}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=async()=>{if(expired)return;if(b.dataset.tab==='create'&&!info?.can_create){toast('您还未开放此权限，具体请找相关管理员');return}tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));show()});
async function creator(){main.innerHTML='<div class="row"><h2 style="font-size:19px">我发布的任务</h2><button id="new" class="primary">新建并发布任务</button></div><div id="tasks">正在加载统计…</div>';document.getElementById('new').onclick=form;await stats()}
async function stats(){try{const r=await api('tasks'),el=document.getElementById('tasks');if(!el)return;el.innerHTML=r.items.map(t=>'<article class="card"><h3>'+esc(t.name)+'</h3>'+(!t.periods.length?'<p class="muted">等待首个执行周期</p>':t.periods.map(p=>'<details open><summary>'+esc(p.period_key)+'</summary><div class="kpis"><span>应交<strong>'+p.expected+'</strong></span><span>已交<strong>'+p.submitted+'</strong></span><span>未交<strong>'+p.pending+'</strong></span></div>'+p.members.map(m=>'<details><summary>'+esc(m.name_snap)+' · '+(m.status==='approved'?'已完成':m.deadline_at<new Date().toLocaleString('sv-SE',{timeZone:'Asia/Shanghai'})?'已逾期':'未提交')+'</summary>'+(m.submission?'<pre>'+esc(m.submission.note||'')+'</pre>'+refs(m.submission).map(ref=>'<button class="primary" data-ref="'+esc(ref)+'" data-task="'+esc(t.task_id)+'">查看图片</button>').join(''):'<p class="muted">暂无提交内容</p>')+'</details>').join('')+'</details>').join(''))+'</article>').join('')||'<div class="card empty">还没有发布任务</div>';el.querySelectorAll('[data-ref]').forEach(b=>b.onclick=async()=>{try{const blob=await api('attachment',{task_id:b.dataset.task,ref:b.dataset.ref},true),url=URL.createObjectURL(blob),img=document.createElement('img');img.className='attachment';img.src=url;img.onload=()=>URL.revokeObjectURL(url);b.after(img);b.remove()}catch(e){toast(e.message)}})}catch(e){toast(e.message)}}
function refs(s){try{return JSON.parse(s.refs_json||'[]')}catch{return []}}
async function form(){try{scope=await api('recipients')}catch(e){toast(e.message);return}selected.clear();requestId=crypto.randomUUID();main.innerHTML='<form class="card" id="form"><h2 style="font-size:20px">新建任务</h2><label class="field">任务名称</label><input id="name" required maxlength="128" placeholder="请输入任务名称"><label class="field">任务要求</label><textarea id="description" required maxlength="2000" placeholder="说明需要提交的文本和图片内容"></textarea><label class="field">接收成员 <span class="muted" id="count">已选 0 人</span></label><div class="scope" id="scope"></div><label class="field">发布周期</label><select id="mode"><option value="once">一次性 · 立即推送</option><option value="day">每日</option><option value="week">每周</option><option value="month">每月</option></select><div id="once"><label class="field">截止时间（留空不限）</label><input type="datetime-local" id="deadline_at"></div><div id="recurring" class="hidden"><label class="field">每日执行时刻</label><input type="time" id="remind_at" value="08:00"><div id="weekly" class="hidden"><label class="field">执行星期（1–7，周一至周日）</label><input type="number" id="weekday" min="1" max="7" value="1"></div><div id="monthly" class="hidden"><label class="field">每月执行日（1–31）</label><input type="number" id="dom" min="1" max="31" value="1"></div><label class="choice"><input type="checkbox" id="has_deadline" checked>设置动态截止</label><div class="grid"><select id="deadline_type"><option value="same_day">执行当天</option><option value="weekend">本周末</option><option value="month_end">本月底</option></select><input type="time" id="deadline_time" value="23:59"></div></div><label class="field">收集内容（至少选择一项）</label><label class="choice"><input type="checkbox" id="collect_text" checked>文字说明</label><label class="choice"><input type="checkbox" id="collect_image">图片</label><p class="muted">固定免审，提交即完成。</p><div class="row"><button type="button" id="back">返回统计</button><button type="submit" class="primary" id="publish">发布任务</button></div></form>';
const box=document.getElementById('scope');function descendants(id){const ds=new Set([id]);for(let i=0;i<scope.departments.length;i++)scope.departments.forEach(d=>{if(ds.has(d.parent_id))ds.add(d.dept_id)});return ds}box.innerHTML=scope.departments.map(d=>{const ds=descendants(d.dept_id),ms=scope.members.filter(m=>m.dept_ids.some(id=>ds.has(id)));return '<label class="choice"><input type="checkbox" data-group="'+esc(ms.map(m=>m.phone).join(','))+'">部门：'+esc(d.name)+'（'+ms.length+' 人，含下级）</label>'}).join('')+scope.roles.map(r=>'<label class="choice"><input type="checkbox" data-group="'+esc(scope.members.filter(m=>m.role_ids.includes(r.role_id)).map(m=>m.phone).join(','))+'">角色：'+esc(r.name)+'</label>').join('')+'<hr>'+scope.members.map(m=>'<label class="choice"><input type="checkbox" data-phone="'+esc(m.phone)+'">'+esc(m.name)+' <span class="muted">'+esc(m.phone.slice(0,3)+'****'+m.phone.slice(-4))+'</span></label>').join('');function sync(){box.querySelectorAll('[data-phone]').forEach(b=>b.checked=selected.has(b.dataset.phone));box.querySelectorAll('[data-group]').forEach(b=>{const ps=b.dataset.group.split(',').filter(Boolean);b.checked=ps.length>0&&ps.every(p=>selected.has(p));b.indeterminate=!b.checked&&ps.some(p=>selected.has(p))});document.getElementById('count').textContent='已选 '+selected.size+' 人'}box.onchange=e=>{const b=e.target;if(b.dataset.phone){b.checked?selected.add(b.dataset.phone):selected.delete(b.dataset.phone)}else if(b.dataset.group!==undefined){b.dataset.group.split(',').filter(Boolean).forEach(p=>b.checked?selected.add(p):selected.delete(p))}sync()};document.getElementById('back').onclick=creator;document.getElementById('mode').onchange=e=>{const mode=e.target.value;document.getElementById('once').classList.toggle('hidden',mode!=='once');document.getElementById('recurring').classList.toggle('hidden',mode==='once');document.getElementById('weekly').classList.toggle('hidden',mode!=='week');document.getElementById('monthly').classList.toggle('hidden',mode!=='month')};document.getElementById('form').onsubmit=async e=>{e.preventDefault();if(busy)return;const val=id=>document.getElementById(id).value,mode=val('mode');const data={upload_modules:[...(document.getElementById('collect_text').checked?['text']:[]),...(document.getElementById('collect_image').checked?['image']:[])],request_id:requestId,name:val('name'),description:val('description'),phones:[...selected],mode,deadline_at:val('deadline_at'),remind_at:val('remind_at'),has_deadline:document.getElementById('has_deadline').checked,deadline_type:val('deadline_type'),deadline_time:val('deadline_time')};if(mode==='week')data.anchor_weekday=+val('weekday');if(mode==='month')data.anchor_dom=+val('dom');busy=true;document.getElementById('publish').disabled=true;try{await api('create',data);toast('任务已发布');await creator()}catch(e){toast(e.message)}finally{busy=false;const b=document.getElementById('publish');if(b)b.disabled=false}}}
refresh();setInterval(()=>{if(document.hidden||expired)return;if(tab==='create'){if(document.getElementById('tasks'))stats();else refresh(false)}else refresh()},30000);window.addEventListener('pageshow',()=>{if(!expired&&tab!=='create')refresh()});
</script></body></html>
